name: Reset admin password (one-shot)

# ============================================================
# Manual-only workflow for emergency password recovery.
# Triggered via the Actions UI (or `gh workflow run`).
# SSHes to the chosen EC2 box (uat / hqhb / waqf) and runs a Node.js helper that:
#   - generates a fresh bcrypt hash for the new password
#   - writes BOTH the hash AND the plaintext into users.last_temp_password
#   - reports rows affected
# DO NOT trigger this casually — it rotates the chosen user's password.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      box:
        description: "Which box to reset on"
        required: true
        default: uat
        type: choice
        options: [uat, hqhb, waqf]
      email:
        description: "Email of the user to reset"
        required: true
        default: "it@hqhb.in"
      new_password:
        description: "New password (leave blank to auto-generate)"
        required: false
        default: ""

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: SSH + run password reset on EC2
        uses: appleboy/ssh-action@v1
        env:
          TARGET_EMAIL: ${{ inputs.email }}
          TARGET_PWD:   ${{ inputs.new_password }}
        with:
          host: ${{ inputs.box == 'uat' && secrets.UAT_EC2_HOST || inputs.box == 'hqhb' && secrets.HQHB_EC2_HOST || secrets.WAQF_EC2_HOST }}
          username: ubuntu
          key: ${{ inputs.box == 'uat' && secrets.UAT_EC2_SSH_KEY || inputs.box == 'hqhb' && secrets.HQHB_EC2_SSH_KEY || secrets.WAQF_EC2_SSH_KEY }}
          envs: TARGET_EMAIL,TARGET_PWD
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ | tail -1)/bin:$PATH"
            cd /home/ubuntu/OneSign/server
            node -e '
              const bcrypt = require("bcryptjs");
              const mysql = require("mysql2/promise");
              require("dotenv").config();
              (async () => {
                const email = process.env.TARGET_EMAIL;
                let pwd = process.env.TARGET_PWD || "";
                if (!pwd) {
                  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
                  for (let i = 0; i < 12; i++) pwd += alphabet[Math.floor(Math.random() * alphabet.length)];
                }
                const cfg = {
                  host: process.env.DB_HOST || "localhost",
                  port: parseInt(process.env.DB_PORT || "3306", 10),
                  user: process.env.DB_USER || "root",
                  password: process.env.DB_PASSWORD || "",
                  database: process.env.DB_NAME || "signflow"
                };
                if (process.env.DB_SOCKET_PATH) cfg.socketPath = process.env.DB_SOCKET_PATH;
                const c = await mysql.createConnection(cfg);
                const hash = bcrypt.hashSync(pwd, 10);
                const [r] = await c.execute(
                  "UPDATE users SET password_hash = ?, last_temp_password = ?, last_temp_password_at = ? WHERE LOWER(email) = LOWER(?)",
                  [hash, pwd, Date.now(), email]
                );
                console.log("");
                console.log("==========================================");
                console.log("Rows updated: " + r.affectedRows);
                console.log("Email:        " + email);
                console.log("Password:     " + pwd);
                console.log("==========================================");
                console.log("");
                if (r.affectedRows === 0) {
                  console.error("ERROR: no user matched that email.");
                  process.exit(1);
                }
                await c.end();
              })().catch(e => { console.error(e); process.exit(1); });
            '
