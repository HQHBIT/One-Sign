name: Copy stored files to Amazon S3 (manual)

# ============================================================
# Copies one box's uploads into its Amazon S3 bucket.
#
# Staged on purpose, and dry-run by default:
#
#   dry-run   contacts the bucket, reports what WOULD be copied. Writes nothing.
#   apply     copies, reading each object back to confirm it was kept.
#
# Re-running is safe. An object already present with identical content is
# skipped by checksum, so an interrupted run continues rather than starting
# over — which matters, because the previous attempt against the self-hosted
# bucket stopped part-way when that bucket filled.
#
# THE CREDENTIALS NEVER APPEAR HERE. They come from repository secrets and reach
# the box as environment variables for the life of one command. Nothing is
# written to .env, so the application's own storage settings are untouched and
# the copy can run while it keeps serving from wherever it serves from now.
#
# Secrets this expects:
#   AWS_REGION, AWS_ACCESS_KEY_ID, AWS_ACCESS_KEY_SECRET
#   AWS_S3_BUCKET_HQHB, AWS_S3_BUCKET_WAQF, AWS_S3_BUCKET_UAT
# ============================================================

on:
  workflow_dispatch:
    inputs:
      box:
        description: "Which box's files to copy"
        required: true
        default: uat
        type: choice
        options: [uat, hqhb, waqf]
      bucket:
        description: "Which bucket to copy into"
        required: true
        default: hqhb
        type: choice
        options: [hqhb, waqf, uat]
      mode:
        description: "What to do"
        required: true
        default: baseline
        type: choice
        options: [box-health, box-cause, find-docs, db-facts, db-check, repoint-dry-run, repoint-apply, repoint-revert, baseline, probe, app-check, recent, api-trace, dry-run, apply]
      confirm:
        description: 'apply: type APPLY. repoint-apply: type REPOINT. repoint-revert: rollback file path'
        required: false
        default: ""

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a live copy without explicit confirmation
        if: inputs.mode == 'apply' && inputs.confirm != 'APPLY'
        run: |
          echo "mode=apply requires confirm=APPLY. Nothing done."
          exit 1

      - name: Copy ${{ inputs.box }} into the ${{ inputs.bucket }} bucket
        uses: appleboy/ssh-action@v1
        env:
          TARGET_REGION: ${{ secrets.AWS_REGION }}
          TARGET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TARGET_SECRET_KEY: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          TARGET_BUCKET: ${{ inputs.bucket == 'hqhb' && secrets.AWS_S3_BUCKET_HQHB || inputs.bucket == 'waqf' && secrets.AWS_S3_BUCKET_WAQF || secrets.AWS_S3_BUCKET_UAT }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        with:
          host: ${{ inputs.box == 'uat' && secrets.UAT_EC2_HOST || inputs.box == 'hqhb' && secrets.HQHB_EC2_HOST || secrets.WAQF_EC2_HOST }}
          username: ubuntu
          key: ${{ inputs.box == 'uat' && secrets.UAT_EC2_SSH_KEY || inputs.box == 'hqhb' && secrets.HQHB_EC2_SSH_KEY || secrets.WAQF_EC2_SSH_KEY }}
          envs: TARGET_REGION,TARGET_ACCESS_KEY,TARGET_SECRET_KEY,TARGET_BUCKET,MODE,CONFIRM
          command_timeout: 60m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ 2>/dev/null | tail -1)/bin:$PATH"

            # box-cause: what took the box down before its last boot? Read-only.
            if [ "$MODE" = "box-cause" ]; then
              echo "=== boots";  (sudo -n journalctl --list-boots 2>/dev/null || journalctl --list-boots 2>/dev/null) | tail -4
              echo "=== previous boot: OOM / killed / hung (kernel)"
              (sudo -n journalctl -k -b -1 --no-pager 2>/dev/null || journalctl -k -b -1 --no-pager 2>/dev/null) | grep -iE 'out of memory|oom-kill|killed process|hung_task|blocked for more than' | tail -15
              echo "=== previous boot: last 15 kernel lines"
              (sudo -n journalctl -k -b -1 --no-pager 2>/dev/null || journalctl -k -b -1 --no-pager 2>/dev/null) | tail -15
              echo "=== previous boot: shutdown/reboot request"
              (sudo -n journalctl -b -1 --no-pager 2>/dev/null || journalctl -b -1 --no-pager 2>/dev/null) | grep -iE 'reboot|shutdown|power|systemd-logind|Stopping|Reached target' | tail -8
              echo "=== the 1 GB node process (largest by RSS)"
              P=$(ps -eo pid,rss,comm --sort=-rss | awk '$3=="node"{print $1; exit}')
              [ -n "$P" ] && { echo "  pid $P rss $(ps -o rss= -p $P) KB"; echo "  cwd: $(sudo -n readlink /proc/$P/cwd 2>/dev/null || readlink /proc/$P/cwd)"; echo "  cmd: $(tr "\0" " " < /proc/$P/cmdline | cut -c1-160)"; }
              echo "=== crash-looping apps: last error lines"
              for n in tsf-backend operation_backend_uat; do
                echo "  --- $n"; pm2 logs "$n" --err --nostream --lines 8 2>/dev/null | tail -8 | cut -c1-220
              done
              echo "=== memory now"; free -m | head -2; uptime
              exit 0
            fi

            # box-health: why is the site slow or down? Read-only, quick, and runs before
            # anything else so it works even when storage settings are irrelevant.
            if [ "$MODE" = "box-health" ]; then
              echo "=== uptime / load";  uptime
              echo "=== memory";         free -m
              echo "=== disk";           df -h / | tail -1
              echo "=== top CPU";        ps -eo pid,pcpu,pmem,etime,comm --sort=-pcpu | head -12
              echo "=== top memory";     ps -eo pid,pcpu,pmem,rss,comm --sort=-rss | head -8
              echo "=== pm2 (name, status, restarts, uptime, mem)"
              pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const p of JSON.parse(s.slice(s.indexOf("[")))){const e=p.pm2_env||{};console.log(`  ${p.name.padEnd(34)} ${String(e.status).padEnd(9)} restarts=${e.restart_time} up=${Math.round((Date.now()-e.pm_uptime)/60000)}m mem=${Math.round((p.monit||{}).memory/1048576)}MB cpu=${(p.monit||{}).cpu}%`)}}catch(x){console.log("  pm2 jlist unreadable")}})'
              echo "=== onesign app: last 40 error lines"
              tail -n 40 /home/ubuntu/.pm2/logs/onesign-backend-uat-error.log 2>/dev/null | grep -vE 'quota exceeded|XML parse error|Deserialization error' | tail -25
              echo "=== onesign app: last 15 output lines"
              tail -n 15 /home/ubuntu/.pm2/logs/onesign-backend-uat-out.log 2>/dev/null
              echo "=== kernel OOM kills (recent)"
              (sudo -n dmesg -T 2>/dev/null || dmesg -T 2>/dev/null) | grep -iE 'out of memory|killed process' | tail -5
              echo "=== nginx upstream errors (last 10)"
              (sudo -n tail -n 200 /var/log/nginx/error.log 2>/dev/null || tail -n 200 /var/log/nginx/error.log 2>/dev/null) | grep -iE 'upstream|timed out|refused' | tail -10 | sed -E 's/client: [0-9.]+/client: -/'
              exit 0
            fi

            if [ -z "$TARGET_BUCKET" ]; then
              echo "No bucket secret is set for that choice. Set AWS_S3_BUCKET_* first."
              exit 1
            fi

            cd /home/ubuntu/OneSign/server || { echo "MISSING /home/ubuntu/OneSign/server"; exit 1; }

            # api-trace: did signature saves and rejections reach the app, and what did
            # it answer? Web-server log lines for those routes (client IPs stripped) and
            # the app's recent error output. Read-only.
            if [ "$MODE" = "api-trace" ]; then
              echo; echo "  NGINX: signature / reject / voice requests today (time, request, status, bytes)"
              for f in /var/log/nginx/access.log /var/log/nginx/*access*.log; do
                [ -f "$f" ] || continue
                sudo -n cat "$f" 2>/dev/null || cat "$f" 2>/dev/null
              done | grep -E "$(date -u +%d/%b/%Y)" | grep -E '/api/users/(me/)?signature|/api/users/me/signatures|/api/users/[^/ ]+/signature|/reject|/reject-voice|/api/assist/.*/signature' \
                | sed -E 's/^[^ ]+ [^ ]+ [^ ]+ //' | awk '{ print $1, $2, $3, $4, $5, $6, $7 }' | sort -u | tail -40
              echo; echo "  APP: last 60 lines of error output"
              pm2 logs onesign_backend_uat --err --nostream --lines 60 2>/dev/null | grep -vE 'quota exceeded|XML parse error' | tail -40 || true
              echo; echo "  APP: which process answers the site"
              pm2 jlist 2>/dev/null | grep -o '"name":"[^"]*onesign[^"]*"' | sort -u
              grep -rhoE 'proxy_pass[^;]+' /etc/nginx/sites-enabled/ 2>/dev/null | sort | uniq -c | head -20
              grep -rlE 'signflow\.umooriqtesadiyah\.org' /etc/nginx/sites-enabled/ 2>/dev/null | while read c; do echo "  config $c:"; grep -E 'server_name|proxy_pass|listen' "$c" | sed 's/^/    /'; done
              exit 0
            fi

            # repoint-*: step 4. Dry run is read-only. Apply needs confirm=REPOINT and
            # writes a mysqldump and a rollback file first. Revert takes the rollback path.
            case "$MODE" in repoint-dry-run|repoint-apply|repoint-revert)
              cat > scripts/.repoint-tmp.mjs <<'REPOINT_EOF'
            // Step 4: point every stored-file column at its bucket key, for ONE box.
            //
            //   node --env-file=.env scripts/.repoint-tmp.mjs                  dry run (default)
            //   node --env-file=.env scripts/.repoint-tmp.mjs --apply          backup, rollback file, repoint
            //   node --env-file=.env scripts/.repoint-tmp.mjs --revert <file>  put values back from a rollback file
            //
            // A row is repointed only when ALL of these hold for its file:
            //   - it is on this box's disk, and
            //   - the bucket has the object at the same key, the same size, and — for a
            //     single-part upload, which is what the copy wrote — an ETag equal to the
            //     MD5 of the disk file.
            // Rows already stored as keys, legacy .json manifests, and files missing
            // everywhere are left exactly as they are.
            //
            // --apply writes a mysqldump of the four tables and a rollback file BEFORE any
            // change, then updates every row in ONE transaction. Each UPDATE carries the old
            // value in its WHERE, so a row changed meanwhile is left alone, not overwritten.
            // The disk copies are not touched: reads still fall back to disk.
            import fs from "node:fs/promises";
            import { createReadStream } from "node:fs";
            import path from "node:path";
            import crypto from "node:crypto";
            import { execFileSync } from "node:child_process";
            import { fileURLToPath } from "node:url";
            import mysql from "mysql2/promise";
            import { S3Client, HeadObjectCommand } from "@aws-sdk/client-s3";

            const __dirname = path.dirname(fileURLToPath(import.meta.url));
            const UPLOADS = path.join(__dirname, "..", "uploads");
            const OUT_DIR = process.env.REPOINT_OUT_DIR || "/home/ubuntu/s3-migration";
            const args = process.argv.slice(2);
            const APPLY = args.includes("--apply");
            const revertAt = args.indexOf("--revert");
            const REVERT = revertAt >= 0 ? args[revertAt + 1] : null;

            const db = {
              host: process.env.DB_HOST || "localhost", port: parseInt(process.env.DB_PORT || "3306", 10),
              user: process.env.DB_USER || "root", password: process.env.DB_PASSWORD || "", database: process.env.DB_NAME || "signflow",
            };
            const conn = await mysql.createConnection(db);

            // ---------- revert ----------
            if (REVERT) {
              const plan = JSON.parse(await fs.readFile(REVERT, "utf8"));
              await conn.beginTransaction();
              let n = 0;
              try {
                for (const c of plan.changes) {
                  const [r] = await conn.query("UPDATE ?? SET ?? = ? WHERE id = ? AND ?? = ?", [c.table, c.column, c.oldValue, c.id, c.column, c.newValue]);
                  n += r.affectedRows;
                }
                await conn.commit();
              } catch (e) { await conn.rollback(); throw e; }
              console.log(`\n  REVERTED ${n} of ${plan.changes.length} value(s) to their filenames.\n`);
              await conn.end();
              process.exit(0);
            }

            const bucket = (process.env.STORAGE_BUCKET || "").trim();
            if (!bucket) { console.log("  STORAGE_BUCKET is not set in .env — refusing."); process.exit(1); }
            const s3 = new S3Client({
              region: (process.env.STORAGE_REGION || "").trim() || undefined,
              endpoint: (process.env.STORAGE_ENDPOINT || "").trim() || undefined,
              forcePathStyle: String(process.env.STORAGE_FORCE_PATH_STYLE || "").trim() === "true",
              credentials: process.env.STORAGE_ACCESS_KEY
                ? { accessKeyId: process.env.STORAGE_ACCESS_KEY.trim(), secretAccessKey: (process.env.STORAGE_SECRET_KEY || "").trim() }
                : undefined,
            });

            const SETS = [
              { table: "requests", cols: { file_path: "documents", signed_file_path: "signed", applied_signature_path: "signatures", reject_voice_path: "voicenotes" } },
              { table: "users", cols: { signature_path: "signatures" } },
              { table: "user_signatures", cols: { file_path: "signatures", original_path: "signatures" } },
              { table: "request_step_signers", cols: { signature_path: "signatures" } },
            ];

            // One verification per distinct file, however many rows reference it.
            const verdicts = new Map();
            async function md5(file) {
              return new Promise((resolve, reject) => {
                const h = crypto.createHash("md5");
                createReadStream(file).on("data", (d) => h.update(d)).on("end", () => resolve(h.digest("hex"))).on("error", reject);
              });
            }
            async function verify(area, name) {
              const key = `${area}/${name}`;
              if (verdicts.has(key)) return verdicts.get(key);
              const p = (async () => {
                let size;
                try { size = (await fs.stat(path.join(UPLOADS, area, name))).size; } catch { size = null; }
                let head;
                try { head = await s3.send(new HeadObjectCommand({ Bucket: bucket, Key: key })); }
                catch (e) {
                  if (e?.$metadata?.httpStatusCode === 404) return size === null ? { ok: false, why: "lost" } : { ok: false, why: "not in bucket" };
                  return { ok: false, why: `bucket error ${e?.name}` };
                }
                if (size === null) return { ok: false, why: "in bucket but not on disk (unverifiable)" };
                if (head.ContentLength !== size) return { ok: false, why: "size differs" };
                const etag = String(head.ETag || "").replace(/"/g, "");
                if (etag && !etag.includes("-") && etag !== (await md5(path.join(UPLOADS, area, name)))) return { ok: false, why: "content differs" };
                return { ok: true };
              })();
              verdicts.set(key, p);
              return p;
            }

            const changes = [];
            const problems = [];
            console.log(`\n  STEP 4 REPOINT — ${APPLY ? "APPLY" : "DRY RUN (nothing is written)"}`);
            console.log("  " + "table.column".padEnd(38) + "rows".padStart(6) + "key".padStart(6) + "json".padStart(6) + "lost".padStart(6) + "REPOINT".padStart(9) + "blocked".padStart(9));
            for (const set of SETS) {
              for (const [col, area] of Object.entries(set.cols)) {
                const [[has]] = await conn.query("SELECT COUNT(*) AS n FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = ? AND column_name = ?", [set.table, col]);
                if (!has.n) continue;
                const [rows] = await conn.query("SELECT id, ?? AS v FROM ?? WHERE ?? IS NOT NULL AND ?? <> ''", [col, set.table, col, col]);
                const c = { rows: rows.length, key: 0, json: 0, lost: 0, repoint: 0, blocked: 0 };
                const queue = rows.slice();
                const worker = async () => {
                  while (queue.length) {
                    const r = queue.pop();
                    const v = String(r.v);
                    if (v.startsWith(area + "/")) { c.key++; continue; }
                    if (/\.json$/i.test(v)) { c.json++; continue; }
                    if (v.includes("/")) { c.blocked++; problems.push(`${set.table}.${col} ${r.id}: unexpected value shape`); continue; }
                    const verdict = await verify(area, v);
                    if (verdict.ok) { c.repoint++; changes.push({ table: set.table, column: col, id: r.id, oldValue: v, newValue: `${area}/${v}` }); }
                    else if (verdict.why === "lost") c.lost++;
                    else { c.blocked++; problems.push(`${set.table}.${col} ${r.id} (${area}/${v}): ${verdict.why}`); }
                  }
                };
                await Promise.all([worker(), worker()]);
                console.log("  " + `${set.table}.${col}`.padEnd(38) + String(c.rows).padStart(6) + String(c.key).padStart(6) + String(c.json).padStart(6) +
                  String(c.lost).padStart(6) + String(c.repoint).padStart(9) + String(c.blocked).padStart(9));
              }
            }
            console.log(`\n  ${changes.length} value(s) verified and ${APPLY ? "to be repointed" : "would be repointed"}; ${problems.length} blocked.`);
            for (const p of problems.slice(0, 25)) console.log("    BLOCKED " + p);
            if (problems.length > 25) console.log(`    ... and ${problems.length - 25} more`);
            for (const ch of changes.slice(0, 4)) console.log(`    e.g. ${ch.table}.${ch.column} ${ch.id}: ${ch.oldValue} -> ${ch.newValue}`);

            if (!APPLY) {
              console.log("\n  DRY RUN — nothing was written.\n");
              await conn.end();
              process.exit(0);
            }
            if (problems.length) {
              console.log("\n  Refusing to apply while any row is blocked. Nothing was written.\n");
              await conn.end();
              process.exit(1);
            }

            // ---------- backup and rollback, BEFORE any change ----------
            const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
            await fs.mkdir(OUT_DIR, { recursive: true });
            const dump = `${OUT_DIR}/backup-before-repoint-${db.database}-${stamp}.sql`;
            execFileSync("mysqldump", ["-h", db.host, "-P", String(db.port), "-u", db.user, "--single-transaction", "--no-tablespaces",
              `--result-file=${dump}`, db.database, "requests", "users", "user_signatures", "request_step_signers"],
              { env: { ...process.env, MYSQL_PWD: db.password }, stdio: ["ignore", "ignore", "inherit"] });
            await fs.chmod(dump, 0o600);
            const dumpSize = (await fs.stat(dump)).size;
            if (dumpSize < 1000) { console.log(`  Backup looks empty (${dumpSize} bytes) — refusing.`); process.exit(1); }
            console.log(`  Backup written: ${dump} (${dumpSize} bytes)`);
            const rollback = `${OUT_DIR}/repoint-rollback-${db.database}-${stamp}.json`;
            await fs.writeFile(rollback, JSON.stringify({ at: new Date().toISOString(), bucket, changes }, null, 1), { mode: 0o600 });
            console.log(`  Rollback written: ${rollback}`);

            await conn.beginTransaction();
            let done = 0;
            try {
              for (const ch of changes) {
                const [r] = await conn.query("UPDATE ?? SET ?? = ? WHERE id = ? AND ?? = ?", [ch.table, ch.column, ch.newValue, ch.id, ch.column, ch.oldValue]);
                done += r.affectedRows;
              }
              await conn.commit();
            } catch (e) {
              await conn.rollback();
              console.log(`  FAILED and rolled back: ${e.message}`);
              process.exit(1);
            }
            console.log(`\n  REPOINTED ${done} of ${changes.length} value(s). Disk copies untouched.`);
            console.log(`  To undo: mode repoint-revert with this rollback file.\n`);
            await conn.end();
            REPOINT_EOF
              STATUS=0
              RUN='env -u TARGET_ACCESS_KEY -u TARGET_SECRET_KEY -u TARGET_BUCKET -u TARGET_REGION nice -n 10 node --env-file=.env scripts/.repoint-tmp.mjs'
              if [ "$MODE" = "repoint-dry-run" ]; then $RUN || STATUS=$?
              elif [ "$MODE" = "repoint-apply" ]; then
                if [ "$CONFIRM" != "REPOINT" ]; then echo "repoint-apply needs confirm=REPOINT. Nothing done."; STATUS=1; else $RUN --apply || STATUS=$?; fi
              else
                case "$CONFIRM" in /home/ubuntu/s3-migration/repoint-rollback-*.json) $RUN --revert "$CONFIRM" || STATUS=$? ;; *) echo "repoint-revert needs confirm=<rollback file path>. Nothing done."; STATUS=1 ;; esac
              fi
              rm -f scripts/.repoint-tmp.mjs
              exit $STATUS ;;
            esac

            # find-docs: search requests, users, emails for two named documents. Read-only.
            # Also the web log for failed uploads today (client addresses stripped).
            if [ "$MODE" = "find-docs" ]; then
              cat > scripts/.finddocs-tmp.mjs <<'FINDDOCS_EOF'
            // Where did two named documents go? Read-only.
            import fs from "node:fs/promises";
            import path from "node:path";
            import { fileURLToPath } from "node:url";
            import mysql from "mysql2/promise";

            const __dirname = path.dirname(fileURLToPath(import.meta.url));
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || "localhost", port: parseInt(process.env.DB_PORT || "3306", 10),
              user: process.env.DB_USER || "root", password: process.env.DB_PASSWORD || "", database: process.env.DB_NAME || "signflow",
            });
            const ist = (ms) => ms ? new Date(Number(ms) + 5.5 * 3600e3).toISOString().replace("T", " ").slice(0, 16) + " IST" : "-";
            const has = async (t, c) => (await conn.query("SELECT COUNT(*) AS n FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = ? AND column_name = ?", [t, c]))[0][0].n > 0;

            console.log(`\n  FIND DOCUMENTS — database ${process.env.DB_NAME}`);

            const [people] = await conn.query(
              "SELECT id, name, email, role, active, org_id FROM users WHERE name LIKE ? OR email LIKE ? ORDER BY name", ["%tinwala%", "%tinwala%"]);
            console.log(`\n  users matching "tinwala": ${people.length}`);
            for (const p of people) console.log(`    ${p.id}  ${p.name} <${p.email}>  role=${p.role} active=${p.active} org=${p.org_id}`);

            const cols = ["r.id", "r.file_name", "r.status", "r.created_at", "r.request_type", "u.name AS requestor"];
            if (await has("requests", "withdrawn_at")) cols.push("r.withdrawn_at");
            if (await has("requests", "deleted_at")) cols.push("r.deleted_at");
            const show = (r) => `    ${r.id}  "${r.file_name}"  ${r.status}  ${ist(r.created_at)}  by ${r.requestor}${r.withdrawn_at ? "  WITHDRAWN " + ist(r.withdrawn_at) : ""}${r.deleted_at ? "  DELETED " + ist(r.deleted_at) : ""}`;

            const [byName] = await conn.query(
              `SELECT ${cols.join(", ")} FROM requests r LEFT JOIN users u ON u.id = r.requestor_id
                WHERE r.file_name LIKE ? OR r.file_name LIKE ? OR r.file_name LIKE ? OR r.file_name LIKE ?
                ORDER BY r.created_at DESC LIMIT 30`, ["%TAP Stall%", "%Naseem%", "%Akram%", "%Budget%"]);
            console.log(`\n  requests whose file name mentions TAP Stall / Naseem / Akram / Budget: ${byName.length}`);
            for (const r of byName) console.log(show(r));

            if (people.length) {
              const [mine] = await conn.query(
                `SELECT ${cols.join(", ")} FROM requests r LEFT JOIN users u ON u.id = r.requestor_id
                  WHERE r.requestor_id IN (${people.map(() => "?").join(",")}) ORDER BY r.created_at DESC LIMIT 25`, people.map((p) => p.id));
              console.log(`\n  latest requests raised by those users: ${mine.length}`);
              for (const r of mine) console.log(show(r));
            }

            // Emails and notifications that mention the documents — sent even if the row later vanished.
            for (const [t, fields] of [["emails", ["subject", "body"]], ["notifications", ["title", "body", "message"]]]) {
              const present = [];
              for (const f of fields) if (await has(t, f)) present.push(f);
              if (!present.length) continue;
              const where = present.map((f) => `(${f} LIKE ? OR ${f} LIKE ? OR ${f} LIKE ?)`).join(" OR ");
              const params = present.flatMap(() => ["%TAP Stall%", "%Naseem%", "%Akram%"]);
              const timeCol = (await has(t, "sent_at")) ? "sent_at" : "created_at";
              const [rows] = await conn.query(`SELECT ${present[0]} AS s, ${timeCol} AS at FROM ${t} WHERE ${where} ORDER BY ${timeCol} DESC LIMIT 10`, params);
              console.log(`\n  ${t} mentioning them: ${rows.length}`);
              for (const r of rows) console.log(`    ${ist(r.at)}  ${String(r.s).replace(/\s+/g, " ").slice(0, 110)}`);
            }
            await conn.end();
            FINDDOCS_EOF
              STATUS=0
              env -u TARGET_ACCESS_KEY -u TARGET_SECRET_KEY -u TARGET_BUCKET -u TARGET_REGION node --env-file=.env scripts/.finddocs-tmp.mjs || STATUS=$?
              rm -f scripts/.finddocs-tmp.mjs
              echo; echo "  WEB LOG: document uploads (POST /api/requests) that did not succeed, last 3 days"
              for f in /var/log/nginx/access.log /var/log/nginx/access.log.1; do [ -f "$f" ] && (sudo -n cat "$f" 2>/dev/null || cat "$f" 2>/dev/null); done \
                | grep -E '"POST /api/requests(/batch)? ' | grep -vE '" (200|201) ' | sed -E 's/^[^ ]+ [^ ]+ [^ ]+ //' | awk '{print $1, $2, $3, $4, $6, $7}' | tail -25
              echo; echo "  APP: create errors in the error log"
              for n in onesign-backend-uat onesign-backend-waqf onesign-backend-hqhb; do f=/home/ubuntu/.pm2/logs/$n-error.log; [ -f "$f" ] && grep -iE '\[create|file is required|Only PDF|too large|LIMIT_FILE_SIZE|multer' "$f" | tail -10; done
              exit $STATUS
            fi

            # db-facts: sizes, row counts and recency of this box's database. Read-only.
            # confirm may carry CHECK_IDS=<comma separated request ids> to test for them.
            if [ "$MODE" = "db-facts" ]; then
              cat > scripts/.dbfacts-tmp.mjs <<'DBFACTS_EOF'
            // Read-only facts about this box's database, for planning a copy between boxes.
            import mysql from "mysql2/promise";
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || "localhost", port: parseInt(process.env.DB_PORT || "3306", 10),
              user: process.env.DB_USER || "root", password: process.env.DB_PASSWORD || "", database: process.env.DB_NAME || "signflow",
            });
            const one = async (sql, p = []) => (await conn.query(sql, p))[0][0];
            const size = await one("SELECT ROUND(SUM(data_length + index_length) / 1048576, 1) AS mb, COUNT(*) AS tables FROM information_schema.tables WHERE table_schema = DATABASE()");
            console.log(`\n  database ${process.env.DB_NAME}: ${size.tables} tables, ${size.mb} MB`);
            for (const t of ["requests", "users", "user_signatures", "request_step_signers", "request_steps", "emails", "notifications", "teams", "organisations"]) {
              try {
                const r = await one(`SELECT COUNT(*) AS n FROM ??`, [t]);
                console.log(`    ${t.padEnd(24)} ${String(r.n).padStart(7)}`);
              } catch { console.log(`    ${t.padEnd(24)}       - (no such table)`); }
            }
            const span = await one("SELECT MIN(created_at) AS first, MAX(created_at) AS last FROM requests");
            console.log(`  requests span: ${new Date(Number(span.first)).toISOString()} .. ${new Date(Number(span.last)).toISOString()}`);
            const [recent] = await conn.query("SELECT id, created_at FROM requests ORDER BY created_at DESC LIMIT 5");
            console.log("  5 most recent request ids:");
            for (const r of recent) console.log(`    ${r.id}  ${new Date(Number(r.created_at)).toISOString()}`);
            // Ids given by the caller (comma separated) — do they exist here?
            if (process.env.CHECK_IDS) {
              const ids = process.env.CHECK_IDS.split(",").filter(Boolean);
              const [found] = await conn.query(`SELECT id FROM requests WHERE id IN (${ids.map(() => "?").join(",")})`, ids);
              console.log(`  of ${ids.length} id(s) from the other box, ${found.length} exist here: ${found.map((f) => f.id).join(" ")}`);
            }
            const orgs = await one("SELECT COUNT(*) AS n FROM organisations").catch(() => ({ n: "-" }));
            const [orgRows] = await conn.query("SELECT id, name, app_url FROM organisations").catch(() => [[]]);
            for (const o of orgRows) console.log(`  organisation: ${o.id} / ${o.name} / ${o.app_url}`);
            console.log(`  scheduler-relevant: ${(await one("SELECT COUNT(*) AS n FROM requests WHERE status = 'pending'")).n} pending, ${(await one("SELECT COUNT(*) AS n FROM requests WHERE status = 'approved_pending'")).n} in the approval window`);
            await conn.end();
            DBFACTS_EOF
              STATUS=0
              case "$CONFIRM" in CHECK_IDS=*) export CHECK_IDS="${CONFIRM#CHECK_IDS=}" ;; esac
              env -u TARGET_ACCESS_KEY -u TARGET_SECRET_KEY -u TARGET_BUCKET -u TARGET_REGION node --env-file=.env scripts/.dbfacts-tmp.mjs || STATUS=$?
              rm -f scripts/.dbfacts-tmp.mjs
              exit $STATUS
            fi

            # db-check: is every file the database references in the bucket? Read-only.
            if [ "$MODE" = "db-check" ]; then
              cat > scripts/.dbcheck-tmp.mjs <<'DBCHECK_EOF'
            // Is every file the DATABASE references present in the bucket? Read-only.
            // Uses the box's own .env (the running app's database and bucket).
            // Existence and size per object; content was checksum-verified by the copy's
            // dry run, and re-reading every file here would load an already fragile box.
            import fs from "node:fs/promises";
            import path from "node:path";
            import { fileURLToPath } from "node:url";
            import mysql from "mysql2/promise";
            import { S3Client, HeadObjectCommand } from "@aws-sdk/client-s3";

            const __dirname = path.dirname(fileURLToPath(import.meta.url));
            const UPLOADS = path.join(__dirname, "..", "uploads");
            const bucket = (process.env.STORAGE_BUCKET || "").trim();
            const s3 = new S3Client({
              region: (process.env.STORAGE_REGION || "").trim() || undefined,
              endpoint: (process.env.STORAGE_ENDPOINT || "").trim() || undefined,
              credentials: process.env.STORAGE_ACCESS_KEY
                ? { accessKeyId: process.env.STORAGE_ACCESS_KEY.trim(), secretAccessKey: (process.env.STORAGE_SECRET_KEY || "").trim() }
                : undefined,
            });

            const SETS = [
              { table: "requests", cols: { file_path: "documents", signed_file_path: "signed", applied_signature_path: "signatures", reject_voice_path: "voicenotes" } },
              { table: "users", cols: { signature_path: "signatures" } },
              { table: "user_signatures", cols: { file_path: "signatures", original_path: "signatures" } },
              { table: "request_step_signers", cols: { signature_path: "signatures" } },
            ];

            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || "localhost", port: parseInt(process.env.DB_PORT || "3306", 10),
              user: process.env.DB_USER || "root", password: process.env.DB_PASSWORD || "", database: process.env.DB_NAME || "signflow",
            });

            const headCache = new Map();
            async function head(key) {
              if (headCache.has(key)) return headCache.get(key);
              let r;
              try { const h = await s3.send(new HeadObjectCommand({ Bucket: bucket, Key: key })); r = { ok: true, size: h.ContentLength }; }
              catch (e) { r = e?.$metadata?.httpStatusCode === 404 ? { ok: false } : { ok: false, err: e?.name || "error" }; }
              headCache.set(key, r);
              return r;
            }
            const diskSize = async (area, name) => { try { return (await fs.stat(path.join(UPLOADS, area, name))).size; } catch { return null; } };

            console.log("\n  EVERY DATABASE FILE REFERENCE vs THE BUCKET (read-only)");
            console.log("  " + "table.column".padEnd(38) + "refs".padStart(6) + "in S3".padStart(7) + "size≠".padStart(7) + "NOT S3".padStart(8) + "  (on disk)".padEnd(12) + "lost".padStart(6) + "json".padStart(6));
            const problems = [];
            const totals = { refs: 0, s3: 0, differs: 0, notS3: 0, notS3OnDisk: 0, lost: 0, json: 0 };
            for (const set of SETS) {
              for (const [col, area] of Object.entries(set.cols)) {
                const [[exists]] = await conn.query("SELECT COUNT(*) AS n FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = ? AND column_name = ?", [set.table, col]);
                if (!exists.n) continue;
                const [rows] = await conn.query(`SELECT ?? AS v FROM ?? WHERE ?? IS NOT NULL AND ?? <> ''`, [col, set.table, col, col]);
                const c = { refs: 0, s3: 0, differs: 0, notS3: 0, notS3OnDisk: 0, lost: 0, json: 0 };
                const queue = rows.map((r) => String(r.v));
                const work = async () => {
                  while (queue.length) {
                    const v = queue.pop();
                    c.refs++;
                    if (/\.json$/i.test(v)) { c.json++; continue; }
                    const name = v.startsWith(area + "/") ? v.slice(area.length + 1) : v;
                    const key = `${area}/${name}`;
                    const [h, ds] = await Promise.all([head(key), diskSize(area, name)]);
                    if (h.ok) {
                      c.s3++;
                      if (ds !== null && h.size !== ds) { c.differs++; problems.push(`size differs  ${key} (disk ${ds}, S3 ${h.size})`); }
                    } else if (ds !== null) {
                      c.notS3++; c.notS3OnDisk++; problems.push(`NOT IN S3, on disk  ${key}${h.err ? " [" + h.err + "]" : ""}`);
                    } else {
                      c.lost++;
                    }
                  }
                };
                await Promise.all([work(), work(), work(), work()]);
                for (const k of Object.keys(totals)) totals[k] += c[k];
                console.log("  " + `${set.table}.${col}`.padEnd(38) + String(c.refs).padStart(6) + String(c.s3).padStart(7) + String(c.differs).padStart(7) +
                  String(c.notS3).padStart(8) + `  (${c.notS3OnDisk})`.padEnd(12) + String(c.lost).padStart(6) + String(c.json).padStart(6));
              }
            }
            console.log("  " + "TOTAL".padEnd(38) + String(totals.refs).padStart(6) + String(totals.s3).padStart(7) + String(totals.differs).padStart(7) +
              String(totals.notS3).padStart(8) + `  (${totals.notS3OnDisk})`.padEnd(12) + String(totals.lost).padStart(6) + String(totals.json).padStart(6));
            console.log(`\n  distinct objects checked in the bucket: ${headCache.size}`);
            console.log("  lost = referenced, but neither on disk nor in S3 (missing before the migration)");
            console.log("  json = legacy Excel approval manifests, not files");
            if (problems.length) {
              console.log(`\n  NEEDS ATTENTION (${problems.length}):`);
              for (const p of problems.slice(0, 30)) console.log("    " + p);
              if (problems.length > 30) console.log(`    ... and ${problems.length - 30} more`);
            } else {
              console.log("\n  Every referenced file that exists is in the bucket at the same size.");
            }
            await conn.end();
            DBCHECK_EOF
              STATUS=0
              env -u TARGET_ACCESS_KEY -u TARGET_SECRET_KEY -u TARGET_BUCKET -u TARGET_REGION nice -n 10 node --env-file=.env scripts/.dbcheck-tmp.mjs || STATUS=$?
              rm -f scripts/.dbcheck-tmp.mjs
              exit $STATUS
            fi

            # recent: where did files written since the switch go? DB rows, disk, bucket.
            # Read-only; uses the box's own .env so it sees what the app sees.
            if [ "$MODE" = "recent" ]; then
              cat > scripts/.recent-tmp.mjs <<'RECENT_EOF'
            // Where did files written since the switch actually go? Read-only.
            // Uses the box's own .env — exactly the settings the running app uses.
            import fs from "node:fs/promises";
            import path from "node:path";
            import { fileURLToPath } from "node:url";
            import mysql from "mysql2/promise";
            import { S3Client, HeadObjectCommand, ListObjectsV2Command } from "@aws-sdk/client-s3";

            const __dirname = path.dirname(fileURLToPath(import.meta.url));
            const UPLOADS = path.join(__dirname, "..", "uploads");
            const SINCE = Date.parse(process.env.SINCE || "2026-09-14T06:30:00Z");

            const bucket = (process.env.STORAGE_BUCKET || "").trim();
            const endpoint = (process.env.STORAGE_ENDPOINT || "").trim();
            console.log("\n  WHERE DID RECENT FILES GO - since " + new Date(SINCE).toISOString());
            console.log(`  app bucket equals signflow-hqhb: ${bucket === "signflow-hqhb"} | equals signflow-waqf: ${bucket === "signflow-waqf"} | length ${bucket.length} | starts signflow-: ${bucket.startsWith("signflow-")}`);
            console.log(`  app endpoint set: ${!!endpoint}`);

            const s3 = new S3Client({
              region: (process.env.STORAGE_REGION || "").trim() || undefined,
              endpoint: endpoint || undefined,
              credentials: process.env.STORAGE_ACCESS_KEY
                ? { accessKeyId: process.env.STORAGE_ACCESS_KEY.trim(), secretAccessKey: (process.env.STORAGE_SECRET_KEY || "").trim() }
                : undefined,
            });
            const inBucket = async (key) => {
              try { await s3.send(new HeadObjectCommand({ Bucket: bucket, Key: key })); return "yes"; }
              catch (e) { return e?.$metadata?.httpStatusCode === 404 ? "NO" : `? ${e?.name}`; }
            };
            const onDisk = async (area, v) => {
              const name = String(v).startsWith(area + "/") ? String(v).slice(area.length + 1) : String(v);
              try { await fs.access(path.join(UPLOADS, area, name)); return "yes"; } catch { return "NO"; }
            };

            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || "localhost", port: parseInt(process.env.DB_PORT || "3306", 10),
              user: process.env.DB_USER || "root", password: process.env.DB_PASSWORD || "", database: process.env.DB_NAME || "signflow",
            });

            const rows = [];
            const [reqs] = await conn.query(
              `SELECT id, file_path, signed_file_path, applied_signature_path, reject_voice_path
                 FROM requests WHERE created_at >= ? OR approved_at >= ? OR rejected_at >= ? OR finalized_at >= ?
                 ORDER BY GREATEST(created_at, COALESCE(approved_at, 0), COALESCE(rejected_at, 0)) DESC LIMIT 40`,
              [SINCE, SINCE, SINCE, SINCE]);
            for (const r of reqs) {
              for (const [col, area] of [["file_path", "documents"], ["signed_file_path", "signed"], ["applied_signature_path", "signatures"], ["reject_voice_path", "voicenotes"]]) {
                if (r[col]) rows.push({ what: `request ${r.id}.${col}`, area, v: r[col] });
              }
            }
            const [sgs] = await conn.query(
              "SELECT id, signature_path FROM request_step_signers WHERE signed_at >= ? AND signature_path IS NOT NULL LIMIT 40", [SINCE]);
            for (const s of sgs) rows.push({ what: `step signer ${s.id}`, area: "signatures", v: s.signature_path });
            const [us] = await conn.query(
              "SELECT id, file_path FROM user_signatures WHERE created_at >= ? OR bg_cleaned_at >= ? LIMIT 40", [SINCE, SINCE]);
            for (const s of us) rows.push({ what: `user signature ${s.id}`, area: "signatures", v: s.file_path });

            console.log(`\n  DATABASE: ${rows.length} file reference(s) written or touched since then`);
            console.log("  " + "row".padEnd(58) + "stored as".padEnd(10) + "disk".padEnd(6) + "bucket");
            for (const r of rows) {
              const isKey = String(r.v).startsWith(r.area + "/");
              const key = isKey ? String(r.v) : `${r.area}/${r.v}`;
              console.log("  " + r.what.slice(0, 57).padEnd(58) + (isKey ? "KEY" : "filename").padEnd(10) +
                (await onDisk(r.area, r.v)).padEnd(6) + (await inBucket(key)));
            }

            console.log("\n  BUCKET: objects last modified since then");
            let token;
            let total = 0;
            const recent = [];
            do {
              const page = await s3.send(new ListObjectsV2Command({ Bucket: bucket, ContinuationToken: token }));
              for (const o of page.Contents || []) {
                total++;
                if (o.LastModified && o.LastModified.getTime() >= SINCE) recent.push(o);
              }
              token = page.IsTruncated ? page.NextContinuationToken : undefined;
            } while (token);
            recent.sort((a, b) => b.LastModified - a.LastModified);
            console.log(`  ${total} object(s) in the bucket; ${recent.length} modified since then`);
            for (const o of recent.slice(0, 40)) console.log(`    ${o.LastModified.toISOString()}  ${String(o.Size).padStart(9)}  ${o.Key}`);
            await conn.end();
            RECENT_EOF
              STATUS=0
              env -u TARGET_ACCESS_KEY -u TARGET_SECRET_KEY -u TARGET_BUCKET -u TARGET_REGION node --env-file=.env scripts/.recent-tmp.mjs || STATUS=$?
              rm -f scripts/.recent-tmp.mjs
              echo; echo "  app log: storage lines"
              pm2 logs onesign_backend_uat --nostream --lines 400 2>/dev/null | grep -iE "filestore|bucket|NoSuchBucket|AccessDenied|quota" | tail -12 || true
              exit $STATUS
            fi

            # app-check: the deployed app's own storage code, with the box's own .env.
            # Then the app's recent log lines about storage. Changes nothing.
            if [ "$MODE" = "app-check" ]; then
              cat > scripts/.appcheck-tmp.mjs <<'APPCHECK_EOF'
            // Does the DEPLOYED application's own storage code reach its bucket, using the
            // box's own .env? Runs storage.healthCheck() — the same write / read-back /
            // delete the admin storage-health page does — and prints status() (which never
            // includes the secret).
            const storage = await import("../src/storage.js");
            const st = storage.status();
            console.log("\n  APP STORAGE CHECK");
            console.log(`  enabled: ${st.enabled} | endpoint: ${st.endpoint === null ? "none (Amazon S3)" : "SET (self-hosted)"} | region: ${st.region} | path-style: ${st.forcePathStyle} | credentials: ${st.credentials}`);
            try {
              const h = await storage.healthCheck();
              const { ok, reason, message, roundTripMs } = h;
              console.log(`  healthCheck: ${ok ? "OK — wrote, read back and deleted a probe object" : "FAILED"}${reason ? " — " + reason : ""}${message ? " — " + message : ""}${roundTripMs ? ` (${roundTripMs} ms)` : ""}`);
              process.exit(ok ? 0 : 1);
            } catch (e) {
              console.log(`  healthCheck threw: ${e?.name || ""} ${e?.message || e}`);
              process.exit(1);
            }
            APPCHECK_EOF
              STATUS=0
              env -u TARGET_ACCESS_KEY -u TARGET_SECRET_KEY -u TARGET_BUCKET -u TARGET_REGION node --env-file=.env scripts/.appcheck-tmp.mjs || STATUS=$?
              rm -f scripts/.appcheck-tmp.mjs
              echo; echo "  app log lines mentioning storage (last 200 lines of each stream):"
              for n in onesign_backend_uat onesign_backend_waqf onesign_backend_hqhb onesign; do
                pm2 describe "$n" >/dev/null 2>&1 || continue
                echo "  --- $n (pm2 status: $(pm2 jlist 2>/dev/null | grep -o "\"name\":\"$n\"[^}]*\"status\":\"[a-z]*\"" | grep -o "status\":\"[a-z]*" | head -1))"
                pm2 logs "$n" --nostream --lines 200 2>/dev/null | grep -iE "filestore|storage|bucket|s3|NoSuchBucket|AccessDenied" | tail -15 || true
              done
              exit $STATUS
            fi

            # probe: can the shared key put, read, delete in this bucket? One object
            # under _probe/, removed again. Nothing else is touched.
            if [ "$MODE" = "probe" ]; then
              cat > scripts/.probe-tmp.mjs <<'PROBE_EOF'
            // Can the shared key do everything the application needs in this bucket?
            // Writes ONE small object under _probe/, reads it back, deletes it, and
            // confirms it is gone. Touches nothing else.
            import crypto from "node:crypto";
            import {
              S3Client, HeadBucketCommand, PutObjectCommand, HeadObjectCommand,
              GetObjectCommand, DeleteObjectCommand, GetBucketVersioningCommand,
            } from "@aws-sdk/client-s3";

            const bucket = (process.env.TARGET_BUCKET || "").trim();
            const s3 = new S3Client({
              region: (process.env.TARGET_REGION || "").trim() || undefined,
              credentials: { accessKeyId: process.env.TARGET_ACCESS_KEY, secretAccessKey: process.env.TARGET_SECRET_KEY },
            });
            const results = [];
            const step = async (name, needed, fn) => {
              try { const note = await fn(); results.push({ name, ok: true, note: note || "" }); return true; }
              catch (e) {
                results.push({ name, ok: false, needed, note: `${e?.name || "error"}${e?.$metadata?.httpStatusCode ? ` (${e.$metadata.httpStatusCode})` : ""}` });
                return false;
              }
            };

            const key = `_probe/${new Date().toISOString().replace(/[:.]/g, "-")}-${crypto.randomUUID()}.txt`;
            const body = Buffer.from(`signflow permission probe ${new Date().toISOString()}`);

            await step("HeadBucket (s3:ListBucket)", true, () => s3.send(new HeadBucketCommand({ Bucket: bucket })));
            const put = await step("PutObject (s3:PutObject)", true, () =>
              s3.send(new PutObjectCommand({ Bucket: bucket, Key: key, Body: body, ContentType: "text/plain" })));
            if (put) {
              await step("HeadObject (s3:GetObject)", true, () => s3.send(new HeadObjectCommand({ Bucket: bucket, Key: key })));
              await step("GetObject and compare (s3:GetObject)", true, async () => {
                const got = await s3.send(new GetObjectCommand({ Bucket: bucket, Key: key }));
                const back = Buffer.from(await got.Body.transformToByteArray());
                if (!back.equals(body)) throw Object.assign(new Error("mismatch"), { name: "ContentMismatch" });
              });
              const del = await step("DeleteObject (s3:DeleteObject)", true, () => s3.send(new DeleteObjectCommand({ Bucket: bucket, Key: key })));
              if (del) {
                await step("Object gone after delete", true, async () => {
                  try { await s3.send(new HeadObjectCommand({ Bucket: bucket, Key: key })); }
                  catch (e) { if (e?.$metadata?.httpStatusCode === 404) return "404 as expected"; throw e; }
                  throw Object.assign(new Error("still there"), { name: "StillPresent" });
                });
              }
            }
            // Versioning status needs s3:GetBucketVersioning, which the app does not need
            // and the policy does not grant, so a refusal here is informational only.
            await step("Versioning status (informational)", false, async () => {
              const v = await s3.send(new GetBucketVersioningCommand({ Bucket: bucket }));
              return `Status: ${v.Status || "never enabled"}`;
            });

            console.log(`\n  PERMISSION PROBE — bucket ${bucket ? "set" : "MISSING"}`);
            for (const r of results) {
              console.log(`  ${r.ok ? "OK  " : r.needed ? "FAIL" : "info"}  ${r.name}${r.note ? " — " + r.note : ""}`);
            }
            const failed = results.filter((r) => !r.ok && r.needed);
            console.log(failed.length ? `\n  ${failed.length} required permission(s) missing.\n` : "\n  The key can do everything the application needs.\n");
            process.exit(failed.length ? 1 : 0);
            PROBE_EOF
              STATUS=0
              node scripts/.probe-tmp.mjs || STATUS=$?
              rm -f scripts/.probe-tmp.mjs
              exit $STATUS
            fi

            # baseline: read-only record of database references against files on disk,
            # taken before anything moves so later counts can be compared with it.
            if [ "$MODE" = "baseline" ]; then
              cat > scripts/.baseline-tmp.mjs <<'BASELINE_EOF'
            // Baseline: what the database says is stored, against what is on this disk.
            // Read-only. SELECTs and stat() only; nothing is written anywhere.
            import fs from "node:fs/promises";
            import path from "node:path";
            import { fileURLToPath } from "node:url";
            import mysql from "mysql2/promise";

            const __dirname = path.dirname(fileURLToPath(import.meta.url));
            const UPLOADS = path.join(__dirname, "..", "uploads");
            const AREAS = ["documents", "signed", "signatures", "voicenotes"];

            // The same columns repoint-to-s3.mjs moves, so this baseline is exactly the
            // set a later repoint would touch.
            const SETS = [
              { table: "requests", cols: { file_path: "documents", signed_file_path: "signed",
                  applied_signature_path: "signatures", reject_voice_path: "voicenotes" } },
              { table: "users", cols: { signature_path: "signatures" } },
              { table: "user_signatures", cols: { file_path: "signatures", original_path: "signatures" } },
              { table: "request_step_signers", cols: { signature_path: "signatures" } },
            ];

            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || "localhost",
              port: parseInt(process.env.DB_PORT || "3306", 10),
              user: process.env.DB_USER || "root",
              password: process.env.DB_PASSWORD || "",
              database: process.env.DB_NAME || "signflow",
            });

            const has = async (table, col) => {
              const [r] = await conn.query("SHOW COLUMNS FROM ?? LIKE ?", [table, col]);
              return r.length > 0;
            };
            const exists = async (p) => { try { await fs.access(p); return true; } catch { return false; } };

            const referenced = Object.fromEntries(AREAS.map((a) => [a, new Set()]));
            console.log("\n  DATABASE REFERENCES vs FILES ON THIS DISK");
            console.log("  " + "-".repeat(78));
            console.log("  " + "".padEnd(50) + "  bare filename".padEnd(19) + "  already a key".padEnd(18));
            console.log("  " + "table.column".padEnd(38) + "org".padEnd(6) + "rows".padStart(6) + "on disk".padStart(11) + "MISSING".padStart(8) +
              "on disk".padStart(10) + "MISSING".padStart(8) + "json".padStart(6) + "other".padStart(6));
            let totalMissing = 0;
            for (const set of SETS) {
              const orgCol = (await has(set.table, "org_id")) ? "org_id" : null;
              for (const [col, area] of Object.entries(set.cols)) {
                if (!(await has(set.table, col))) { console.log(`  ${(set.table + "." + col).padEnd(38)}(no such column)`); continue; }
                const [rows] = await conn.query(
                  `SELECT ${orgCol ? "COALESCE(??, '-')" : "'-'"} AS org, ?? AS v FROM ?? WHERE ?? IS NOT NULL AND ?? <> ''`,
                  orgCol ? [orgCol, col, set.table, col, col] : [col, set.table, col, col]);
                const byOrg = {};
                for (const r of rows) {
                  const o = (byOrg[r.org] ||= { rows: 0, disk: 0, missing: 0, kdisk: 0, kmissing: 0, json: 0, odd: 0 });
                  o.rows++;
                  const v = String(r.v);
                  if (/\.json$/i.test(v)) { o.json++; continue; }
                  // A value already written as a bucket key ("documents/abc.pdf") keeps its
                  // disk copy at the same name, and that disk copy is what gets moved.
                  const isKey = v.startsWith(area + "/");
                  if (!isKey && v.includes("/")) { o.odd++; continue; }
                  const name = isKey ? v.slice(area.length + 1) : v;
                  referenced[area].add(name);
                  const ok = await exists(path.join(UPLOADS, area, name));
                  if (isKey) { if (ok) o.kdisk++; else { o.kmissing++; totalMissing++; } }
                  else if (ok) o.disk++; else { o.missing++; totalMissing++; }
                }
                if (!rows.length) console.log(`  ${(set.table + "." + col).padEnd(38)}${"-".padEnd(6)}${"0".padStart(6)}`);
                for (const [org, o] of Object.entries(byOrg)) {
                  console.log(`  ${(set.table + "." + col).padEnd(38)}${String(org).padEnd(6)}${String(o.rows).padStart(6)}` +
                    `${String(o.disk).padStart(11)}${String(o.missing).padStart(8)}${String(o.kdisk).padStart(10)}${String(o.kmissing).padStart(8)}` +
                    `${String(o.json).padStart(6)}${String(o.odd).padStart(6)}`);
                }
              }
            }

            console.log("\n  FILES ON DISK NOT REFERENCED BY ANY OF THOSE COLUMNS");
            for (const area of AREAS) {
              let names = [];
              try { names = (await fs.readdir(path.join(UPLOADS, area), { withFileTypes: true })).filter((d) => d.isFile()).map((d) => d.name); } catch {}
              const orphans = names.filter((n) => !referenced[area].has(n)).length;
              console.log(`  ${area.padEnd(12)} ${String(names.length).padStart(5)} on disk, ${String(orphans).padStart(5)} unreferenced`);
            }
            // Signature and voice-note columns are read by building a disk path by hand
            // (path.join(SIG_DIR, value)), not through the filestore, so a value already
            // written as "signatures/x.png" resolves to signatures/signatures/x.png and is
            // not found. Who is affected, and is anything still waiting on a signature?
            console.log("\n  SIGNATURE / VOICE ROWS ALREADY WRITTEN AS KEYS (unreadable by the running code)");
            const [keyedSigners] = await conn.query(`
              SELECT r.status AS request_status, COUNT(*) AS n, COUNT(DISTINCT r.id) AS requests,
                     COUNT(DISTINCT sg.user_id) AS signers
                FROM request_step_signers sg
                JOIN request_steps st ON st.id = sg.step_id
                JOIN requests r ON r.id = st.request_id
               WHERE sg.signature_path LIKE 'signatures/%'
               GROUP BY r.status`);
            for (const k of keyedSigners) console.log(`  step signers: request ${String(k.request_status).padEnd(10)} ${k.n} row(s), ${k.requests} request(s), ${k.signers} signer(s)`);
            const [keyedApplied] = await conn.query(`
              SELECT status, COUNT(*) AS n, COUNT(DISTINCT requestor_id) AS requestors
                FROM requests WHERE applied_signature_path LIKE 'signatures/%' GROUP BY status`);
            for (const k of keyedApplied) console.log(`  applied signature: request ${String(k.status).padEnd(10)} ${k.n} row(s), ${k.requestors} requestor(s)`);
            const [[voice]] = await conn.query("SELECT COUNT(*) AS n FROM requests WHERE reject_voice_path LIKE 'voicenotes/%'");
            console.log(`  voice notes: ${voice.n} row(s)`);

            const [[conf]] = await conn.query("SELECT COUNT(*) AS n FROM requests WHERE confidential = 1");
            console.log(`\n  confidential requests: ${conf.n}`);
            console.log(`  referenced but MISSING from disk, all columns: ${totalMissing}`);
            console.log("\n  Read-only: nothing was written.\n");
            await conn.end();
            BASELINE_EOF
              STATUS=0
              node --env-file=.env scripts/.baseline-tmp.mjs || STATUS=$?
              rm -f scripts/.baseline-tmp.mjs
              exit $STATUS
            fi

            # Carried inline rather than run from the checkout, because a box runs
            # whatever its last deploy shipped and this must not wait on one.
            # Written at scripts/ depth so its imports and node_modules resolve,
            # and removed afterwards.
            cat > scripts/.migrate-tmp.mjs <<'MIGRATE_EOF'
            // Copy every stored file on this box into an S3 bucket.
            //
            //   node scripts/migrate-to-s3.mjs                 # inventory + what would move
            //   node scripts/migrate-to-s3.mjs --apply         # actually copy
            //   node scripts/migrate-to-s3.mjs --apply --limit 50
            //
            // Target, given as environment variables so no secret is ever typed on a command
            // line and none is read from a file in this repository:
            //
            //   TARGET_BUCKET       required
            //   TARGET_REGION       required for AWS (e.g. ap-south-1)
            //   TARGET_ACCESS_KEY   required unless the box has an instance role
            //   TARGET_SECRET_KEY   "
            //   TARGET_ENDPOINT     ONLY for a self-hosted server. Leave UNSET for Amazon
            //                       S3 — setting it is what makes the SDK talk to something
            //                       other than AWS.
            //   TARGET_FORCE_PATH_STYLE=true   usually needed for self-hosted, not for AWS.
            //
            // Deliberately separate from the application's own STORAGE_* settings. That lets
            // the copy run against a new bucket while the app keeps serving from the old one,
            // which is the only way to migrate without a window where reads fail.
            //
            // KEYS MATCH THE FILESTORE. An object is written at "area/filename" — the same
            // key readStored derives from a stored value — so once everything is across, the
            // database rows can be repointed and reads resolve without moving anything again.
            //
            // Safe to re-run. An object already present with identical content is skipped,
            // so an interrupted run continues where it stopped rather than starting over.
            import fs from "node:fs/promises";
            import path from "node:path";
            import crypto from "node:crypto";
            import { fileURLToPath } from "node:url";
            import {
              S3Client, PutObjectCommand, HeadObjectCommand, GetObjectCommand,
            } from "@aws-sdk/client-s3";

            const __dirname = path.dirname(fileURLToPath(import.meta.url));
            const UPLOADS = path.join(__dirname, "..", "uploads");

            // The filestore's areas. Anything outside them is not a stored document and is
            // left alone rather than swept into the bucket.
            const AREAS = ["documents", "signed", "signatures", "voicenotes"];

            const args = process.argv.slice(2);
            const APPLY = args.includes("--apply");
            const LIMIT = (() => {
              const i = args.indexOf("--limit");
              return i >= 0 ? parseInt(args[i + 1], 10) || 0 : 0;
            })();
            const CONCURRENCY = 4;

            const cfg = {
              bucket: (process.env.TARGET_BUCKET || "").trim(),
              region: (process.env.TARGET_REGION || "").trim(),
              endpoint: (process.env.TARGET_ENDPOINT || "").trim(),
              accessKey: (process.env.TARGET_ACCESS_KEY || "").trim(),
              secretKey: (process.env.TARGET_SECRET_KEY || "").trim(),
              pathStyle: String(process.env.TARGET_FORCE_PATH_STYLE || "").trim() === "true",
            };

            const MB = (n) => (n / 1048576).toFixed(1) + " MB";
            const CONTENT_TYPES = {
              ".pdf": "application/pdf",
              ".xlsx": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              ".xls": "application/vnd.ms-excel",
              ".png": "image/png", ".jpg": "image/jpeg", ".jpeg": "image/jpeg",
              ".webm": "audio/webm", ".json": "application/json",
            };

            // ---- what is on this box ----
            async function walk(dir, base = dir) {
              const out = [];
              let entries = [];
              try { entries = await fs.readdir(dir, { withFileTypes: true }); } catch { return out; }
              for (const e of entries) {
                const full = path.join(dir, e.name);
                if (e.isDirectory()) out.push(...await walk(full, base));
                else {
                  const stat = await fs.stat(full).catch(() => null);
                  if (stat) {
                    out.push({
                      // Forward slashes: a key is not a Windows path, and a backslash here
                      // would create an object nothing can ever find again.
                      key: path.relative(base, full).split(path.sep).join("/"),
                      full,
                      size: stat.size,
                    });
                  }
                }
              }
              return out;
            }

            const md5 = async (file) => {
              const h = crypto.createHash("md5");
              h.update(await fs.readFile(file));
              return h.digest("hex");
            };

            console.log("");
            const files = [];
            for (const area of AREAS) files.push(...await walk(path.join(UPLOADS, area), UPLOADS));
            files.sort((a, b) => a.key.localeCompare(b.key));
            const totalBytes = files.reduce((a, f) => a + f.size, 0);

            console.log(`  On this box: ${files.length} file(s), ${MB(totalBytes)}`);
            for (const area of AREAS) {
              const sub = files.filter((f) => f.key.startsWith(area + "/"));
              if (sub.length) console.log(`    ${area.padEnd(12)} ${String(sub.length).padStart(5)}  ${MB(sub.reduce((a, f) => a + f.size, 0))}`);
            }

            if (!cfg.bucket) {
              console.log("\n  No TARGET_BUCKET set, so nothing was contacted and nothing copied.");
              console.log("  This is the inventory only. Set the TARGET_* variables to go further.\n");
              process.exit(0);
            }

            // ---- the target ----
            // endpoint is passed as undefined when unset, which is what makes the SDK talk
            // to Amazon S3 rather than a self-hosted server.
            const s3 = new S3Client({
              region: cfg.region || undefined,
              endpoint: cfg.endpoint || undefined,
              forcePathStyle: cfg.pathStyle,
              credentials: cfg.accessKey
                ? { accessKeyId: cfg.accessKey, secretAccessKey: cfg.secretKey }
                : undefined,          // an instance role, where the box has one
            });

            console.log(`\n  Target: ${cfg.bucket}${cfg.endpoint ? ` at ${cfg.endpoint}` : " on Amazon S3"}` +
              `${cfg.region ? ` (${cfg.region})` : ""}`);
            console.log(`  Mode:   ${APPLY ? "APPLY — objects will be written" : "dry run — nothing will be written"}`);
            if (LIMIT) console.log(`  Limit:  first ${LIMIT} file(s)`);
            console.log("");

            /** Already there, byte for byte? ETag is the MD5 for a single-part upload, which
             *  is what this writes, so it is a content check and not merely a size one. */
            async function alreadyThere(f) {
              try {
                const head = await s3.send(new HeadObjectCommand({ Bucket: cfg.bucket, Key: f.key }));
                const etag = String(head.ETag || "").replace(/"/g, "");
                if (head.ContentLength !== f.size) return { same: false, reason: "different size" };
                if (etag && !etag.includes("-")) {
                  return { same: etag === await md5(f.full), reason: "different content" };
                }
                return { same: true };        // multipart ETag: size match is the best available
              } catch (e) {
                if (e?.name === "NotFound" || e?.name === "NoSuchKey" || e?.$metadata?.httpStatusCode === 404) {
                  return { same: false, reason: "absent" };
                }
                throw e;
              }
            }

            const tally = { skipped: 0, copied: 0, differs: 0, failed: 0, bytes: 0 };
            const failures = [];
            const work = LIMIT ? files.slice(0, LIMIT) : files;

            async function handle(f) {
              try {
                const there = await alreadyThere(f);
                if (there.same) { tally.skipped++; return; }
                if (there.reason === "different content") {
                  // Not overwritten without being asked: the bucket copy differing from disk
                  // is a fact worth reporting, and quietly replacing one with the other
                  // destroys the evidence of whichever was wrong.
                  tally.differs++;
                  failures.push(`${f.key} — differs from the copy already in the bucket (not overwritten)`);
                  return;
                }
                if (!APPLY) { tally.copied++; tally.bytes += f.size; return; }

                const body = await fs.readFile(f.full);
                await s3.send(new PutObjectCommand({
                  Bucket: cfg.bucket,
                  Key: f.key,
                  Body: body,
                  ContentType: CONTENT_TYPES[path.extname(f.key).toLowerCase()] || "application/octet-stream",
                }));
                // Read back rather than trust the write. A bucket that accepted an object it
                // did not keep is the failure this migration exists to rule out.
                const back = await s3.send(new GetObjectCommand({ Bucket: cfg.bucket, Key: f.key }));
                const bytes = Buffer.from(await back.Body.transformToByteArray());
                if (Buffer.compare(bytes, body) !== 0) throw new Error("read back different from what was written");
                tally.copied++; tally.bytes += f.size;
              } catch (e) {
                tally.failed++;
                const msg = e?.name === "Error" ? e.message : `${e?.name || "error"}${e?.message ? `: ${e.message}` : ""}`;
                failures.push(`${f.key} — ${msg}`);
              }
            }

            // A few at a time. One at a time is slow over a thousand files; all at once
            // opens a thousand sockets and trips any rate limit the bucket has.
            let cursor = 0;
            let done = 0;
            await Promise.all(Array.from({ length: CONCURRENCY }, async () => {
              while (cursor < work.length) {
                const f = work[cursor++];
                await handle(f);
                if (++done % 100 === 0) console.log(`  … ${done}/${work.length}`);
              }
            }));

            console.log("\n  " + "-".repeat(64));
            console.log(`  already there   ${tally.skipped}`);
            console.log(`  ${APPLY ? "copied         " : "would copy     "} ${tally.copied}  (${MB(tally.bytes)})`);
            if (tally.differs) console.log(`  DIFFERS         ${tally.differs}  — on disk and in the bucket, and not the same`);
            if (tally.failed) console.log(`  failed          ${tally.failed}`);
            console.log("  " + "-".repeat(64));

            if (failures.length) {
              console.log("\n  Not copied:");
              for (const f of failures.slice(0, 40)) console.log(`    ${f}`);
              if (failures.length > 40) console.log(`    … and ${failures.length - 40} more`);
              // A quota is the one failure worth naming, because it is not a fault in the
              // file and re-running fixes nothing until the bucket is made bigger.
              if (failures.some((f) => /quota/i.test(f))) {
                console.log("\n  The bucket is full. Raise its quota and run this again — everything");
                console.log("  already copied is skipped, so it continues rather than restarting.");
              }
            }

            if (!APPLY && tally.copied) {
              console.log("\n  Nothing was written. Re-run with --apply to copy.");
            }
            console.log("");
            process.exit(tally.failed ? 1 : 0);
            MIGRATE_EOF

            # The temporary copy is removed whatever happens. Without the `|| true`
            # a failing migration would abort the script and leave the file — with
            # nothing secret in it, but still litter on a production box.
            STATUS=0
            if [ "$MODE" = "apply" ]; then
              node scripts/.migrate-tmp.mjs --apply || STATUS=$?
            else
              node scripts/.migrate-tmp.mjs || STATUS=$?
            fi
            rm -f scripts/.migrate-tmp.mjs
            exit $STATUS
