name: Box diagnostic (temporary)

# Manual-only, READ-ONLY. Inspects one of the three boxes. Touches nothing:
# no writes, no restart, no .env edit, no pm2 command that changes state.
#
# Values are never printed. The .env dump shows key NAMES only, with every value
# replaced by <set>, because DB_PASSWORD and JWT_SECRET are not GitHub secrets
# and so would not be masked in the run log.
#
# Remove this workflow once the investigation is done.

on:
  workflow_dispatch:
    inputs:
      box:
        description: "Which box to inspect"
        required: true
        default: uat
        type: choice
        options: [uat, hqhb, waqf]
      audit_confidential:
        description: "Also check which confidential documents still decrypt"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the ${{ inputs.box }} box
        uses: appleboy/ssh-action@v1
        env:
          AUDIT_CONFIDENTIAL: ${{ inputs.audit_confidential }}
        with:
          host: ${{ inputs.box == 'uat' && secrets.UAT_EC2_HOST || inputs.box == 'hqhb' && secrets.HQHB_EC2_HOST || secrets.WAQF_EC2_HOST }}
          username: ubuntu
          key: ${{ inputs.box == 'uat' && secrets.UAT_EC2_SSH_KEY || inputs.box == 'hqhb' && secrets.HQHB_EC2_SSH_KEY || secrets.WAQF_EC2_SSH_KEY }}
          envs: AUDIT_CONFIDENTIAL
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ 2>/dev/null | tail -1)/bin:$PATH"

            echo "=============== 1. pm2 processes ==============="
            # pm2 prints an out-of-date banner to stdout, which corrupts jlist,
            # so read the plain table instead and note the version skew.
            pm2 list 2>&1 | head -25 || echo "pm2 not available"
            echo "--- pm2 versions (a skew means restarts may not take effect) ---"
            pm2 -v 2>&1 | tail -1
            pm2 ping 2>&1 | tail -3

            echo
            echo "=============== 2. EVERY listening TCP port ==============="
            # Unfiltered on purpose: a narrow grep is how the app's real port was
            # missed the first time round.
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | sed 's/  */ /g' | head -30

            echo
            echo "=============== 3. which local port answers the API ==============="
            for port in 3000 3001 5000 5001 5101 8080; do
              CODE=$(curl -s -o /tmp/o.out -w "%{http_code}" --max-time 5 "http://127.0.0.1:$port/api/auth/organisations" 2>/dev/null || echo "conn-fail")
              if [ "$CODE" != "conn-fail" ] && [ "$CODE" != "000" ]; then
                echo "  :$port -> HTTP $CODE"
                echo -n "     body: "; head -c 260 /tmp/o.out 2>/dev/null; echo
              else
                echo "  :$port -> no listener"
              fi
              rm -f /tmp/o.out
            done

            echo
            echo "=============== 4. nginx: which domain, which upstream ==============="
            sudo nginx -T 2>/dev/null | grep -E '^\s*(server_name|proxy_pass|listen|root)' | sed 's/^[[:space:]]*//' | sort -u | head -30 || echo "cannot dump nginx config"

            echo
            echo "=============== 5. .env keys present (values redacted) ==============="
            cd /home/ubuntu/OneSign/server 2>/dev/null || { echo "MISSING /home/ubuntu/OneSign/server"; exit 0; }
            if [ -f .env ]; then
              sed -E 's/^([A-Za-z0-9_]+)=.*/\1=<set>/' .env | grep -E '^[A-Za-z0-9_]+=' | sort
              echo "--- PORT value (not a secret) ---"
              grep -E '^PORT=' .env || echo "PORT not set in .env"
            else
              echo "NO .env FILE"
            fi

            echo
            echo "=============== 6. error log, whichever process exists ==============="
            for n in onesign_backend_uat onesign_backend_hqhb onesign_backend_waqf; do
              pm2 describe "$n" >/dev/null 2>&1 && { echo "--- $n ---"; pm2 logs "$n" --nostream --lines 40 --err 2>/dev/null | tail -25; }
            done

            echo
            echo "=============== 7. database reachability and org data ==============="
            node -e '
              const mysql = require("mysql2/promise");
              require("dotenv").config();
              (async () => {
                const cfg = {
                  host: process.env.DB_HOST || "localhost",
                  port: parseInt(process.env.DB_PORT || "3306", 10),
                  user: process.env.DB_USER || "root",
                  password: process.env.DB_PASSWORD || "",
                  database: process.env.DB_NAME || "signflow"
                };
                if (process.env.DB_SOCKET_PATH) cfg.socketPath = process.env.DB_SOCKET_PATH;
                console.log("connecting host=" + cfg.host + " db=" + cfg.database + " user=" + cfg.user);
                const c = await mysql.createConnection(cfg);
                const [t] = await c.execute("SHOW TABLES");
                console.log("connected OK — " + t.length + " tables");
                const [o] = await c.execute("SELECT id, name, allow_oneaccess, allow_local, active FROM organisations");
                console.log("organisations: " + JSON.stringify(o));
                const [u] = await c.execute("SELECT org_id, COUNT(*) AS n FROM users GROUP BY org_id");
                console.log("users by org: " + JSON.stringify(u));
                await c.end();
              })().catch(e => console.log("DB ERROR: " + e.code + " — " + e.message));
            ' 2>&1 | tail -12

            echo
            echo "=============== 8. client build freshness ==============="
            ls -la /home/ubuntu/OneSign/client/dist/index.html 2>/dev/null || echo "NO client/dist/index.html"
            ls -la /home/ubuntu/OneSign/client/dist/assets/ 2>/dev/null | head -6

            echo
            echo "=============== 9. nginx static serving ==============="
            echo "--- nginx error log (last 25) ---"
            sudo tail -25 /var/log/nginx/error.log 2>/dev/null || echo "cannot read nginx error log"
            echo "--- nginx worker user ---"
            grep -E '^\s*user\s' /etc/nginx/nginx.conf 2>/dev/null || echo "user directive not set (defaults to nginx/www-data)"
            echo "--- permissions along the document root ---"
            namei -l /home/ubuntu/OneSign/client/dist/index.html 2>/dev/null || ls -ld /home /home/ubuntu /home/ubuntu/OneSign /home/ubuntu/OneSign/client /home/ubuntu/OneSign/client/dist 2>/dev/null
            echo "--- can the nginx user actually read index.html? ---"
            NGX_USER=$(ps -o user= -C nginx 2>/dev/null | grep -v root | head -1)
            echo "nginx worker runs as: ${NGX_USER:-unknown}"
            [ -n "$NGX_USER" ] && sudo -u "$NGX_USER" test -r /home/ubuntu/OneSign/client/dist/index.html && echo "READABLE by $NGX_USER" || echo "NOT readable by ${NGX_USER:-nginx user}"
            echo "--- reproduce the request on the box ---"
            for h in signflow.waqftrust.com signflow.umooriqtesadiyah.org; do
              echo -n "  Host: $h  /  -> HTTP "
              curl -s -o /dev/null -w "%{http_code}\n" --max-time 6 -H "Host: $h" http://127.0.0.1/ 2>/dev/null || echo "fail"
            done
            echo
            echo "=============== 10. confidential decryption audit (opt-in) ==============="
            if [ "${AUDIT_CONFIDENTIAL}" != "true" ]; then
              echo "skipped (set audit_confidential=true to run it)"
            else
              # Carried inline rather than called from the checkout, because the box runs
              # whatever branch its deploy last shipped — and diagnosing production must
              # not require shipping code to production first. Written at scripts/ depth
              # so its relative imports and node_modules resolve, and removed afterwards.
              cd /home/ubuntu/OneSign/server || exit 0
              cat > scripts/.audit-tmp.mjs <<'MJS'
            // Which confidential documents can this server still decrypt, and which copy is at fault?
            //
            //   node --env-file=.env scripts/audit-confidential.mjs
            //
            // STRICTLY READ-ONLY. It never writes, never deletes, and never prints a byte
            // of decrypted content — only whether decryption succeeded, and why not.
            //
            // A GCM tag failure means the key decrypting is not the key that encrypted, OR
            // the ciphertext changed. From one document those look identical. They stop
            // looking identical the moment you check BOTH copies of the same file, because
            // a document lives in two places during the migration and they were written at
            // different times by different code:
            //
            //   disk OK, bucket BAD  -> the bucket object is damaged; the key is fine
            //   both BAD             -> the key on this box is not the encrypting key
            //   both OK              -> this document was never the problem
            //
            // That distinction decides everything downstream: a damaged object is repaired
            // from the disk copy sitting right next to it, whereas a wrong key means
            // recovering the old CONFIDENTIAL_KEY and nothing else will do.
            //
            // Byte LENGTHS are printed alongside, because a short bucket copy is the
            // signature of an upload cut off partway — which is what a quota that ran out
            // mid-migration produces.
            import "dotenv/config";
            import fs from "node:fs/promises";
            import crypto from "node:crypto";
            import mysql from "mysql2/promise";
            import { looksEncrypted, decryptBuffer, isEnabled, keyStatus } from "../src/confidential.js";
            import { diskPathFor, isKey, keyFor } from "../src/filestore.js";
            import * as storage from "../src/storage.js";

            const sha = (b) => crypto.createHash("sha256").update(b).digest("hex").slice(0, 12);

            console.log(`\n  Confidential key: ${isEnabled() ? "configured" : "MISSING"} (${keyStatus()})`);
            console.log(`  Object storage:   ${storage.isEnabled() ? "enabled" : "disabled"}\n`);

            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || "localhost",
              port: parseInt(process.env.DB_PORT || "3306", 10),
              user: process.env.DB_USER || "root",
              password: process.env.DB_PASSWORD || "",
              database: process.env.DB_NAME || "signflow",
            });
            const [rows] = await conn.execute(
              `SELECT id, file_path, created_at, status FROM requests
                WHERE confidential = 1 ORDER BY created_at ASC`);
            await conn.end();

            if (!rows.length) { console.log("  No confidential documents on this box.\n"); process.exit(0); }
            console.log(`  ${rows.length} confidential request(s).\n`);

            // Try one copy: does it exist, and does it decrypt? Never conflates the two.
            async function probe(get) {
              try {
                const raw = await get();
                if (!raw) return { state: "absent" };
                if (!looksEncrypted(raw)) return { state: "plaintext", len: raw.length, sha: sha(raw) };
                try { decryptBuffer(raw); return { state: "ok", len: raw.length, sha: sha(raw) }; }
                catch (e) { return { state: "bad", len: raw.length, sha: sha(raw), why: e.message }; }
              } catch (e) { return { state: "absent", why: e.code || e.message }; }
            }

            const tally = { diskOnly: [], bothBad: [], bothOk: [], other: [] };
            let sample = null;   // raw bytes of one failing document, for the key probe below

            for (const r of rows) {
              const when = new Date(Number(r.created_at)).toISOString().slice(0, 10);
              const disk = await probe(() => fs.readFile(diskPathFor("documents", r.file_path)));
              const buck = storage.isEnabled()
                ? await probe(() => storage.getFileBytes(keyFor("documents", r.file_path)))
                : { state: "n/a" };

              const served = isKey(r.file_path) && storage.isEnabled() ? "bucket" : "disk";
              const line = `${when}  ${r.id}  serves-from:${served.padEnd(6)}  ` +
                `disk:${disk.state}${disk.len ? "/" + disk.len + "B/" + disk.sha : ""}  ` +
                `bucket:${buck.state}${buck.len ? "/" + buck.len + "B/" + buck.sha : ""}`;

              if (disk.state === "bad" && !sample) {
                sample = await fs.readFile(diskPathFor("documents", r.file_path)).catch(() => null);
              }
              if (disk.state === "ok" && buck.state === "bad") tally.diskOnly.push(line);
              else if (disk.state === "bad" && buck.state === "bad") tally.bothBad.push(line);
              else if (disk.state === "bad" && buck.state !== "ok") tally.bothBad.push(line);
              else if (disk.state === "ok" || buck.state === "ok") tally.bothOk.push(line);
              else tally.other.push(line);
            }

            const rule = "  " + "-".repeat(78);
            const show = (title, xs) => { if (!xs.length) return;
              console.log(`\n  ${title}: ${xs.length}`); console.log(rule); xs.forEach(x => console.log("  " + x)); };

            show("REPAIRABLE — disk copy is good, bucket copy is damaged", tally.diskOnly);
            show("UNREADABLE — no good copy anywhere", tally.bothBad);
            show("HEALTHY", tally.bothOk);
            show("OTHER", tally.other);

            console.log("\n" + rule);
            if (tally.bothBad.length && !tally.diskOnly.length && !tally.bothOk.length) {
              console.log("  VERDICT: every copy fails. The key on this box is not the key these were");
              console.log("  sealed with. Recover the previous CONFIDENTIAL_KEY — nothing else opens them.");
            } else if (tally.diskOnly.length) {
              console.log("  VERDICT: the key is FINE. The bucket copies are damaged and the intact disk");
              console.log("  copies are sitting right beside them. Compare the byte lengths above: a short");
              console.log("  bucket copy means the upload was cut off partway.");
              console.log("  Fix: make readStored fall back to disk when the bucket copy will not decrypt,");
              console.log("  then re-upload the damaged objects from disk.");
            } else if (tally.bothOk.length && !tally.bothBad.length) {
              console.log("  VERDICT: every confidential document decrypts. The fault is elsewhere.");
            }

            // ---- which derivation of the secret would open these? ----
            // The secret in CONFIDENTIAL_KEY has not changed, but the way a key is COMPUTED
            // from it has: the feature originally used the secret's base64 decoding verbatim
            // and later switched to deriving it with scrypt. Both schemes write an identical
            // envelope — same magic byte, same version, same key id — so a file sealed under
            // one and opened under the other gets all the way to the authentication tag and
            // only fails there. That is precisely the error being seen.
            //
            // So try the candidates against a file that is actually failing. Reports only
            // WHICH scheme authenticates. No key material and no plaintext is ever printed.
            if (sample && looksEncrypted(sample)) {
              const raw = (process.env.CONFIDENTIAL_KEY || "")
                .replace(/^﻿/, "").replace(/^['\"]|['\"]$/g, "").trim();
              const untrimmed = process.env.CONFIDENTIAL_KEY || "";
              const sized = (b) => (b && b.length === 32 ? b : null);
              const candidates = [
                ["scrypt(secret) — the scheme in use now",
                  crypto.scryptSync(raw, Buffer.from("signflow.confidential.v1"), 32, { N: 16384, r: 8, p: 1 })],
                ["base64(secret) — the ORIGINAL scheme, before the key was derived",
                  sized(Buffer.from(raw, "base64"))],
                ["base64(secret, untrimmed) — same, with whitespace left on",
                  sized(Buffer.from(untrimmed, "base64"))],
                ["hex(secret)", sized(Buffer.from(raw, "hex"))],
                ["utf8(secret)", sized(Buffer.from(raw, "utf8"))],
                ["sha256(secret)", crypto.createHash("sha256").update(raw).digest()],
              ];

              const iv = sample.subarray(3, 15);
              const tag = sample.subarray(sample.length - 16);
              const body = sample.subarray(15, sample.length - 16);

              console.log("\n  Which derivation opens a failing document?");
              console.log(rule);
              let winner = null;
              for (const [name, k] of candidates) {
                if (!k) { console.log(`    n/a     ${name} (not 32 bytes)`); continue; }
                try {
                  const d = crypto.createDecipheriv("aes-256-gcm", k, iv);
                  d.setAuthTag(tag);
                  Buffer.concat([d.update(body), d.final()]);
                  console.log(`    OPENS   ${name}`);
                  winner = winner || name;
                } catch { console.log(`    no      ${name}`); }
              }
              if (winner) {
                console.log(`\n  The documents were sealed under: ${winner}`);
                console.log("  They are RECOVERABLE — the secret is right, only the derivation moved.");
              } else {
                console.log("\n  No derivation of the CURRENT secret opens them. The secret itself");
                console.log("  differs from the one they were sealed with, and must be recovered.");
              }
            }

            console.log("");
            process.exit(0);

            MJS
              node scripts/.audit-tmp.mjs 2>&1 || echo "audit could not run on this box"
              rm -f scripts/.audit-tmp.mjs
            fi
