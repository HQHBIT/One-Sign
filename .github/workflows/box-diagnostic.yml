name: Box diagnostic (temporary)

# Manual-only, READ-ONLY. Inspects one of the three boxes. Touches nothing:
# no writes, no restart, no .env edit, no pm2 command that changes state.
#
# Values are never printed. The .env dump shows key NAMES only, with every value
# replaced by <set>, because DB_PASSWORD and JWT_SECRET are not GitHub secrets
# and so would not be masked in the run log.
#
# Remove this workflow once the investigation is done.

on:
  workflow_dispatch:
    inputs:
      box:
        description: "Which box to inspect"
        required: true
        default: uat
        type: choice
        options: [uat, hqhb, waqf]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the ${{ inputs.box }} box
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ inputs.box == 'uat' && secrets.UAT_EC2_HOST || inputs.box == 'hqhb' && secrets.HQHB_EC2_HOST || secrets.WAQF_EC2_HOST }}
          username: ubuntu
          key: ${{ inputs.box == 'uat' && secrets.UAT_EC2_SSH_KEY || inputs.box == 'hqhb' && secrets.HQHB_EC2_SSH_KEY || secrets.WAQF_EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ 2>/dev/null | tail -1)/bin:$PATH"

            echo "=============== 1. pm2 processes ==============="
            # pm2 prints an out-of-date banner to stdout, which corrupts jlist,
            # so read the plain table instead and note the version skew.
            pm2 list 2>&1 | head -25 || echo "pm2 not available"
            echo "--- pm2 versions (a skew means restarts may not take effect) ---"
            pm2 -v 2>&1 | tail -1
            pm2 ping 2>&1 | tail -3

            echo
            echo "=============== 2. EVERY listening TCP port ==============="
            # Unfiltered on purpose: a narrow grep is how the app's real port was
            # missed the first time round.
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | sed 's/  */ /g' | head -30

            echo
            echo "=============== 3. which local port answers the API ==============="
            for port in 3000 3001 5000 5001 5101 8080; do
              CODE=$(curl -s -o /tmp/o.out -w "%{http_code}" --max-time 5 "http://127.0.0.1:$port/api/auth/organisations" 2>/dev/null || echo "conn-fail")
              if [ "$CODE" != "conn-fail" ] && [ "$CODE" != "000" ]; then
                echo "  :$port -> HTTP $CODE"
                echo -n "     body: "; head -c 260 /tmp/o.out 2>/dev/null; echo
              else
                echo "  :$port -> no listener"
              fi
              rm -f /tmp/o.out
            done

            echo
            echo "=============== 4. nginx: which domain, which upstream ==============="
            sudo nginx -T 2>/dev/null | grep -E '^\s*(server_name|proxy_pass|listen|root)' | sed 's/^[[:space:]]*//' | sort -u | head -30 || echo "cannot dump nginx config"

            echo
            echo "=============== 5. .env keys present (values redacted) ==============="
            cd /home/ubuntu/OneSign/server 2>/dev/null || { echo "MISSING /home/ubuntu/OneSign/server"; exit 0; }
            if [ -f .env ]; then
              sed -E 's/^([A-Za-z0-9_]+)=.*/\1=<set>/' .env | grep -E '^[A-Za-z0-9_]+=' | sort
              echo "--- PORT value (not a secret) ---"
              grep -E '^PORT=' .env || echo "PORT not set in .env"
            else
              echo "NO .env FILE"
            fi

            echo
            echo "=============== 6. error log, whichever process exists ==============="
            for n in onesign_backend_uat onesign_backend_hqhb onesign_backend_waqf; do
              pm2 describe "$n" >/dev/null 2>&1 && { echo "--- $n ---"; pm2 logs "$n" --nostream --lines 40 --err 2>/dev/null | tail -25; }
            done

            echo
            echo "=============== 7. database reachability and org data ==============="
            node -e '
              const mysql = require("mysql2/promise");
              require("dotenv").config();
              (async () => {
                const cfg = {
                  host: process.env.DB_HOST || "localhost",
                  port: parseInt(process.env.DB_PORT || "3306", 10),
                  user: process.env.DB_USER || "root",
                  password: process.env.DB_PASSWORD || "",
                  database: process.env.DB_NAME || "signflow"
                };
                if (process.env.DB_SOCKET_PATH) cfg.socketPath = process.env.DB_SOCKET_PATH;
                console.log("connecting host=" + cfg.host + " db=" + cfg.database + " user=" + cfg.user);
                const c = await mysql.createConnection(cfg);
                const [t] = await c.execute("SHOW TABLES");
                console.log("connected OK — " + t.length + " tables");
                const [o] = await c.execute("SELECT id, name, allow_oneaccess, allow_local, active FROM organisations");
                console.log("organisations: " + JSON.stringify(o));
                const [u] = await c.execute("SELECT org_id, COUNT(*) AS n FROM users GROUP BY org_id");
                console.log("users by org: " + JSON.stringify(u));
                await c.end();
              })().catch(e => console.log("DB ERROR: " + e.code + " — " + e.message));
            ' 2>&1 | tail -12

            echo
            echo "=============== 8. client build freshness ==============="
            ls -la /home/ubuntu/OneSign/client/dist/index.html 2>/dev/null || echo "NO client/dist/index.html"
            ls -la /home/ubuntu/OneSign/client/dist/assets/ 2>/dev/null | head -6

            echo
            echo "=============== 9. nginx static serving ==============="
            echo "--- nginx error log (last 25) ---"
            sudo tail -25 /var/log/nginx/error.log 2>/dev/null || echo "cannot read nginx error log"
            echo "--- nginx worker user ---"
            grep -E '^\s*user\s' /etc/nginx/nginx.conf 2>/dev/null || echo "user directive not set (defaults to nginx/www-data)"
            echo "--- permissions along the document root ---"
            namei -l /home/ubuntu/OneSign/client/dist/index.html 2>/dev/null || ls -ld /home /home/ubuntu /home/ubuntu/OneSign /home/ubuntu/OneSign/client /home/ubuntu/OneSign/client/dist 2>/dev/null
            echo "--- can the nginx user actually read index.html? ---"
            NGX_USER=$(ps -o user= -C nginx 2>/dev/null | grep -v root | head -1)
            echo "nginx worker runs as: ${NGX_USER:-unknown}"
            [ -n "$NGX_USER" ] && sudo -u "$NGX_USER" test -r /home/ubuntu/OneSign/client/dist/index.html && echo "READABLE by $NGX_USER" || echo "NOT readable by ${NGX_USER:-nginx user}"
            echo "--- reproduce the request on the box ---"
            for h in signflow.waqftrust.com signflow.umooriqtesadiyah.org; do
              echo -n "  Host: $h  /  -> HTTP "
              curl -s -o /dev/null -w "%{http_code}\n" --max-time 6 -H "Host: $h" http://127.0.0.1/ 2>/dev/null || echo "fail"
            done
