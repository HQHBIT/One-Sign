name: WAQF box diagnostic (temporary)

# One-shot, manual-only, READ-ONLY. Written to diagnose the 500 on the WAQF box
# after its first deploy. Touches nothing: no writes, no restart, no .env edit.
#
# Values are never printed. The .env dump shows key NAMES only, with every value
# replaced by <set>, because DB_PASSWORD and JWT_SECRET are not GitHub secrets
# and so would not be masked in the run log.
#
# Remove this workflow once the investigation is done.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the WAQF box
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WAQF_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.WAQF_EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ 2>/dev/null | tail -1)/bin:$PATH"

            echo "=============== 1. pm2 process state ==============="
            # restart_time climbing is the tell for a crash loop.
            pm2 jlist 2>/dev/null | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                let l=[];try{l=JSON.parse(s)}catch(e){return console.log("could not parse pm2 jlist")}
                if(!l.length) return console.log("NO PM2 PROCESSES");
                for(const p of l) console.log(
                  p.name,"| status:",p.pm2_env.status,
                  "| restarts:",p.pm2_env.restart_time,
                  "| unstable:",p.pm2_env.unstable_restarts,
                  "| uptime:",p.pm2_env.pm_uptime?Math.round((Date.now()-p.pm2_env.pm_uptime)/1000)+"s":"n/a",
                  "| PORT:",(p.pm2_env.env&&p.pm2_env.env.PORT)||"unset");
              })' || echo "pm2 not available"

            echo
            echo "=============== 2. last 80 error log lines ==============="
            pm2 logs onesign_backend_waqf --nostream --lines 80 --err 2>/dev/null || echo "no pm2 error log"

            echo
            echo "=============== 3. does the app answer on 127.0.0.1:5000 ==============="
            echo -n "GET /api/auth/config -> HTTP "
            curl -s -o /tmp/cfg.out -w "%{http_code}\n" --max-time 8 http://127.0.0.1:5000/api/auth/config || echo "(curl failed)"
            echo "body (first 400 chars):"
            head -c 400 /tmp/cfg.out 2>/dev/null; echo
            rm -f /tmp/cfg.out

            echo
            echo "=============== 4. what is listening ==============="
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':(80|443|3000|5000|5101|3306)\b' || echo "nothing on 80/443/3000/5000/5101/3306"

            echo
            echo "=============== 5. .env keys present (values redacted) ==============="
            cd /home/ubuntu/OneSign/server 2>/dev/null || { echo "MISSING /home/ubuntu/OneSign/server"; exit 0; }
            if [ -f .env ]; then
              sed -E 's/^([A-Za-z0-9_]+)=.*/\1=<set>/' .env | grep -E '^[A-Za-z0-9_]+=' | sort
            else
              echo "NO .env FILE"
            fi

            echo
            echo "=============== 6. can the app reach its database ==============="
            node -e '
              const mysql = require("mysql2/promise");
              require("dotenv").config();
              (async () => {
                const cfg = {
                  host: process.env.DB_HOST || "localhost",
                  port: parseInt(process.env.DB_PORT || "3306", 10),
                  user: process.env.DB_USER || "root",
                  password: process.env.DB_PASSWORD || "",
                  database: process.env.DB_NAME || "signflow"
                };
                if (process.env.DB_SOCKET_PATH) cfg.socketPath = process.env.DB_SOCKET_PATH;
                console.log("connecting to host=" + cfg.host + " port=" + cfg.port +
                            " db=" + cfg.database + " user=" + cfg.user + " (password not shown)");
                const c = await mysql.createConnection(cfg);
                const [t] = await c.execute("SHOW TABLES");
                console.log("connected OK — " + t.length + " tables");
                const [o] = await c.execute("SELECT id, name, allow_oneaccess, allow_local, active FROM organisations");
                console.log("organisations: " + JSON.stringify(o));
                const [u] = await c.execute("SELECT org_id, COUNT(*) AS n FROM users GROUP BY org_id");
                console.log("users by org: " + JSON.stringify(u));
                await c.end();
              })().catch(e => console.log("DB ERROR: " + e.code + " — " + e.message));
            ' 2>&1 | tail -20

            echo
            echo "=============== 7. client build + nginx target ==============="
            ls -la /home/ubuntu/OneSign/client/dist/index.html 2>/dev/null || echo "NO client/dist/index.html"
            grep -rhE 'proxy_pass|listen |root ' /etc/nginx/sites-enabled/ 2>/dev/null | sed 's/^[[:space:]]*//' | sort -u | head -20 || echo "cannot read nginx sites-enabled"
