name: Box triage (temporary)

# Deliberately tiny. The full diagnostic runs a dozen sections and the first of
# them, `pm2 list`, hangs on a box that is out of disk or memory — so the tool
# for finding out why a box is unwell is itself unusable exactly when it is
# needed. This asks four cheap questions and gets out.
#
# READ-ONLY. Nothing is written, restarted or changed.

on:
  workflow_dispatch:
    inputs:
      box:
        description: "Which box"
        required: true
        default: uat
        type: choice
        options: [uat, hqhb, waqf]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Triage ${{ inputs.box }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ inputs.box == 'uat' && secrets.UAT_EC2_HOST || inputs.box == 'hqhb' && secrets.HQHB_EC2_HOST || secrets.WAQF_EC2_HOST }}
          username: ubuntu
          key: ${{ inputs.box == 'uat' && secrets.UAT_EC2_SSH_KEY || inputs.box == 'hqhb' && secrets.HQHB_EC2_SSH_KEY || secrets.WAQF_EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "=== disk ==="
            df -h 2>&1 | head -15
            echo
            echo "=== memory ==="
            free -m 2>&1 | head -5
            echo
            echo "=== load ==="
            uptime 2>&1
            echo
            echo "=== biggest directories under /home/ubuntu (top 12) ==="
            timeout 60 du -xh -d 2 /home/ubuntu 2>/dev/null | sort -rh | head -12 || echo "du timed out"
            echo
            echo "=== is anything listening on the app ports ==="
            (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ":(80|443|5001|5101|9000) " | head -8 || echo "none of the expected ports are listening"
