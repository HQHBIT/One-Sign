name: Email log diagnostic (temporary)

# One-shot, manual-only: prints the most recent rows of the emails log
# (recipient, subject, template, delivered flag, SendGrid error) so email
# delivery problems can be diagnosed without DB access. Bodies are never
# printed. Remove this workflow once the investigation is done.

on:
  workflow_dispatch:
    inputs:
      box:
        description: "Which box to inspect"
        required: true
        default: uat
        type: choice
        options: [uat, hqhb, waqf]
      email:
        description: "Optional: look at ONE recipient (their log rows, account flags, SendGrid suppressions)"
        required: false
        default: ""

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read recent email log on EC2
        uses: appleboy/ssh-action@v1
        env:
          PROBE_EMAIL: ${{ inputs.email }}
        with:
          host: ${{ inputs.box == 'uat' && secrets.UAT_EC2_HOST || inputs.box == 'hqhb' && secrets.HQHB_EC2_HOST || secrets.WAQF_EC2_HOST }}
          username: ubuntu
          key: ${{ inputs.box == 'uat' && secrets.UAT_EC2_SSH_KEY || inputs.box == 'hqhb' && secrets.HQHB_EC2_SSH_KEY || secrets.WAQF_EC2_SSH_KEY }}
          envs: PROBE_EMAIL
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ | tail -1)/bin:$PATH"
            cd /home/ubuntu/OneSign/server || exit 1
            echo "SENDGRID_API_KEY present in .env: $(grep -qE '^SENDGRID_API_KEY=.+' .env && echo YES || echo NO)"
            echo "SENDGRID_FROM_EMAIL: $(grep -E '^SENDGRID_FROM_EMAIL=' .env | cut -d= -f2-)"
            node -e '
              const mysql = require("mysql2/promise");
              require("dotenv").config();
              (async () => {
                const cfg = {
                  host: process.env.DB_HOST || "localhost",
                  port: parseInt(process.env.DB_PORT || "3306", 10),
                  user: process.env.DB_USER || "root",
                  password: process.env.DB_PASSWORD || "",
                  database: process.env.DB_NAME || "signflow"
                };
                if (process.env.DB_SOCKET_PATH) cfg.socketPath = process.env.DB_SOCKET_PATH;
                const c = await mysql.createConnection(cfg);
                const [rows] = await c.execute(
                  "SELECT to_email, LEFT(subject, 45) AS subject, template, sent_at, delivered, LEFT(COALESCE(error, \"\"), 90) AS error FROM emails ORDER BY sent_at DESC LIMIT 15"
                );
                console.log("recent email log (newest first):");
                for (const r of rows) {
                  console.log(
                    new Date(Number(r.sent_at)).toISOString(), "|",
                    r.delivered ? "DELIVERED" : "FAILED/LOGGED", "|",
                    r.template, "|", r.to_email, "|", r.subject, r.error ? "| ERR: " + r.error : ""
                  );
                }
                const [agg] = await c.execute(
                  "SELECT delivered, COUNT(*) AS n FROM emails WHERE sent_at > ? GROUP BY delivered",
                  [Date.now() - 7 * 24 * 3600 * 1000]
                );
                console.log("last 7 days:", JSON.stringify(agg));

                // Confidential "your document was signed" emails (PR #79): the
                // sent body names the document; the log masks it. Flags only —
                // no names, no bodies printed here.
                const [conf] = await c.execute(
                  "SELECT sent_at, delivered, subject, body FROM emails WHERE template = 'confidential_approved' ORDER BY sent_at DESC LIMIT 5");
                console.log("");
                console.log("recent confidential_approved emails:", conf.length);
                for (const r of conf) {
                  console.log("  " + new Date(Number(r.sent_at)).toISOString() + " | " + (r.delivered ? "ACCEPTED by SendGrid" : "NOT SENT") +
                    " | subject generic: " + (r.subject === "Your confidential document has been signed" ? "yes" : "NO") +
                    " | document named in email (masked in log): " + (String(r.body || "").includes("[confidential document]") ? "YES" : "no"));
                }

                // ---- one recipient, if asked ----
                const who = String(process.env.PROBE_EMAIL || "").trim().toLowerCase();
                if (who) {
                  console.log("");
                  console.log("==== recipient: " + who + " ====");
                  const [u] = await c.execute(
                    "SELECT id, role, active, email_notifications, LOWER(email) = ? AS primary_match, LOWER(COALESCE(secondary_email, \"\")) = ? AS secondary_match FROM users WHERE LOWER(email) = ? OR LOWER(COALESCE(secondary_email, \"\")) = ?",
                    [who, who, who, who]);
                  console.log("account rows matching:", u.length, JSON.stringify(u.map(x => ({ role: x.role, active: x.active, email_notifications: x.email_notifications, primary: !!x.primary_match, secondary: !!x.secondary_match }))));
                  const [mine] = await c.execute(
                    "SELECT template, sent_at, delivered, LEFT(COALESCE(error, \"\"), 120) AS error FROM emails WHERE LOWER(to_email) = ? ORDER BY sent_at DESC LIMIT 15", [who]);
                  console.log("emails logged TO this address:", mine.length, "(newest first)");
                  for (const r of mine) console.log("  " + new Date(Number(r.sent_at)).toISOString() + " | " + (r.delivered ? "ACCEPTED by SendGrid" : "NOT SENT") + " | " + r.template + (r.error ? " | ERR: " + r.error : ""));
                  const [inapp] = await c.execute(
                    "SELECT COUNT(*) AS n, MAX(n.created_at) AS last FROM notifications n JOIN users u ON u.id = n.user_id WHERE LOWER(u.email) = ?", [who]);
                  console.log("in-app notifications for this account:", inapp[0].n, inapp[0].last ? "(last " + new Date(Number(inapp[0].last)).toISOString() + ")" : "");

                  // SendGrid keeps lists of addresses it will silently drop.
                  // A send to a suppressed address still returns 202, so our
                  // log says "accepted" while nothing ever arrives.
                  const key = process.env.SENDGRID_API_KEY;
                  if (!key) { console.log("no SENDGRID_API_KEY on this box — cannot check suppressions"); }
                  else {
                    for (const list of ["bounces", "blocks", "spam_reports", "invalid_emails"]) {
                      try {
                        const res = await fetch("https://api.sendgrid.com/v3/suppression/" + list + "/" + encodeURIComponent(who), { headers: { Authorization: "Bearer " + key } });
                        const body = res.ok ? await res.json() : null;
                        const hit = Array.isArray(body) && body.length > 0;
                        console.log("SendGrid " + list + ": " + (res.ok ? (hit ? "LISTED — " + JSON.stringify(body[0]).slice(0, 200) : "not listed") : "HTTP " + res.status));
                      } catch (e) { console.log("SendGrid " + list + ": lookup failed — " + e.message); }
                    }
                  }
                }
                await c.end();
              })().catch(e => { console.error(e.message); process.exit(1); });
            '
