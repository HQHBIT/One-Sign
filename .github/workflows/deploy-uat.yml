name: Deploy OneSign to EC2 (UAT)
on:
  push:
    branches: [UAT]
  # Secrets change without any code changing. A manual run lets a rotated
  # key reach the server without inventing a dummy commit.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          BASE=${{ github.event.before }}
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "Comparing $BASE..HEAD"
          if git diff --name-only "$BASE" HEAD | grep -q '^client/'; then
            echo "client=true" >> $GITHUB_OUTPUT
          else
            echo "client=false" >> $GITHUB_OUTPUT
          fi
          if git diff --name-only "$BASE" HEAD | grep -q '^server/'; then
            echo "server=true" >> $GITHUB_OUTPUT
          else
            echo "server=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        if: steps.changes.outputs.client == 'true'
        run: cd client && npm ci

      - name: Build client
        if: steps.changes.outputs.client == 'true'
        run: cd client && npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Copy client build to EC2
        if: steps.changes.outputs.client == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.UAT_EC2_SSH_KEY }}
          source: "client/dist/"
          target: "/home/ubuntu/OneSign"
          overwrite: true

      - name: Copy server to EC2
        if: steps.changes.outputs.server == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.UAT_EC2_SSH_KEY }}
          source: "server/"
          target: "/home/ubuntu/OneSign"
          overwrite: true

      # Always runs: this step syncs secrets into .env, and a secret can change
      # with no server file touched. Gating it on server changes meant a rotated
      # key silently never applied. Restart is a couple of seconds via pm2.
      - name: Sync secrets and restart backend on EC2
        uses: appleboy/ssh-action@v1
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          SENDGRID_FROM_NAME: ${{ secrets.SENDGRID_FROM_NAME }}
          ONEACCESS_API_BASE_URL: ${{ secrets.ONEACCESS_API_BASE_URL }}
          ONEACCESS_FRONTEND_URL: ${{ secrets.ONEACCESS_FRONTEND_URL }}
          ONEACCESS_APP_SLUG: ${{ secrets.ONEACCESS_APP_SLUG }}
          ONEACCESS_REDIRECT_URL: ${{ secrets.ONEACCESS_REDIRECT_URL }}
          ONEACCESS_APP_ID: ${{ secrets.ONEACCESS_APP_ID }}
          ONEACCESS_CLIENT_ID: ${{ secrets.ONEACCESS_CLIENT_ID }}
          ONEACCESS_CLIENT_SECRET: ${{ secrets.ONEACCESS_CLIENT_SECRET }}
          ONEACCESS_PUBLIC_KEY_PATH: ${{ secrets.ONEACCESS_PUBLIC_KEY_PATH }}
          ONEACCESS_ACCESS_TOKEN_TTL: ${{ secrets.ONEACCESS_ACCESS_TOKEN_TTL }}
          AUTH_LOCAL_LOGIN_ENABLED: ${{ secrets.AUTH_LOCAL_LOGIN_ENABLED }}
          CONFIDENTIAL_KEY: ${{ secrets.CONFIDENTIAL_KEY }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_FORCE_PATH_STYLE: ${{ secrets.STORAGE_FORCE_PATH_STYLE }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.UAT_DB_USER }}
          DB_PASSWORD: ${{ secrets.UAT_DB_PASSWORD }}
          DB_NAME: ${{ secrets.UAT_DB_NAME }}
          JWT_SECRET: ${{ secrets.UAT_JWT_SECRET }}
        with:
          host: ${{ secrets.UAT_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.UAT_EC2_SSH_KEY }}
          envs: SENDGRID_API_KEY,SENDGRID_FROM_EMAIL,SENDGRID_FROM_NAME,ONEACCESS_API_BASE_URL,ONEACCESS_FRONTEND_URL,ONEACCESS_APP_SLUG,ONEACCESS_REDIRECT_URL,ONEACCESS_APP_ID,ONEACCESS_CLIENT_ID,ONEACCESS_CLIENT_SECRET,ONEACCESS_PUBLIC_KEY_PATH,ONEACCESS_ACCESS_TOKEN_TTL,AUTH_LOCAL_LOGIN_ENABLED,CONFIDENTIAL_KEY,STORAGE_ENDPOINT,STORAGE_REGION,STORAGE_BUCKET,STORAGE_FORCE_PATH_STYLE,STORAGE_ACCESS_KEY,STORAGE_SECRET_KEY,DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,JWT_SECRET
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ | tail -1)/bin:$PATH"
            cd /home/ubuntu/OneSign/server
            # Sync SendGrid config from CI secrets into .env. Only writes when a key is
            # provided; leaves all other .env vars (DB creds, JWT_SECRET) untouched.
            if [ -n "$SENDGRID_API_KEY" ]; then
              touch .env
              grep -v -E '^SENDGRID_(API_KEY|FROM_EMAIL|FROM_NAME)=' .env > .env.tmp || true
              echo "SENDGRID_API_KEY=$SENDGRID_API_KEY" >> .env.tmp
              [ -n "$SENDGRID_FROM_EMAIL" ] && echo "SENDGRID_FROM_EMAIL=$SENDGRID_FROM_EMAIL" >> .env.tmp
              [ -n "$SENDGRID_FROM_NAME" ] && echo "SENDGRID_FROM_NAME=$SENDGRID_FROM_NAME" >> .env.tmp
              mv .env.tmp .env
              echo "SendGrid config synced to .env (LIVE email)."
            else
              echo "No SENDGRID_API_KEY secret set — email stays in log-only mode."
            fi
            # Sync the confidential-documents key. Without it the feature fails
            # CLOSED: the toggle is hidden and the API refuses confidential uploads,
            # so a missing secret can never mean a document is silently unprotected.
            # WARNING: rotating or losing this key makes every existing
            # confidential document permanently unreadable.
            if [ -n "$CONFIDENTIAL_KEY" ]; then
              touch .env
              grep -v -E '^CONFIDENTIAL_KEY=' .env > .env.tmp || true
              echo "CONFIDENTIAL_KEY=$CONFIDENTIAL_KEY" >> .env.tmp
              mv .env.tmp .env
              echo "Confidential documents: key synced (feature ENABLED)."
            else
              echo "No CONFIDENTIAL_KEY secret set — confidential documents stay disabled."
            fi
            # Sync object-storage config. Fails CLOSED in the same spirit as the
            # key above: with no STORAGE_BUCKET the application keeps using the
            # filesystem, so a missing secret degrades to the previous behaviour
            # rather than losing uploads.
            if [ -n "$STORAGE_BUCKET" ]; then
              touch .env
              grep -v -E '^STORAGE_' .env > .env.tmp || true
              echo "STORAGE_ENDPOINT=$STORAGE_ENDPOINT" >> .env.tmp
              echo "STORAGE_REGION=$STORAGE_REGION" >> .env.tmp
              echo "STORAGE_BUCKET=$STORAGE_BUCKET" >> .env.tmp
              echo "STORAGE_FORCE_PATH_STYLE=$STORAGE_FORCE_PATH_STYLE" >> .env.tmp
              echo "STORAGE_ACCESS_KEY=$STORAGE_ACCESS_KEY" >> .env.tmp
              echo "STORAGE_SECRET_KEY=$STORAGE_SECRET_KEY" >> .env.tmp
              mv .env.tmp .env
              echo "Object storage: config synced (bucket $STORAGE_BUCKET)."
            else
              echo "No STORAGE_BUCKET secret set — files stay on the local filesystem."
            fi
            # Sync oneAccess SSO config from CI secrets. Rewrites the whole ONEACCESS_*
            # block (+ the AUTH_LOCAL_LOGIN_ENABLED cutover flag) when API_BASE_URL is
            # set; otherwise oneAccess stays disabled and local login is used.
            if [ -n "$ONEACCESS_API_BASE_URL" ]; then
              touch .env
              grep -v -E '^(ONEACCESS_[A-Z_]+|AUTH_LOCAL_LOGIN_ENABLED)=' .env > .env.tmp || true
              echo "ONEACCESS_API_BASE_URL=$ONEACCESS_API_BASE_URL" >> .env.tmp
              [ -n "$ONEACCESS_FRONTEND_URL" ] && echo "ONEACCESS_FRONTEND_URL=$ONEACCESS_FRONTEND_URL" >> .env.tmp
              [ -n "$ONEACCESS_APP_SLUG" ] && echo "ONEACCESS_APP_SLUG=$ONEACCESS_APP_SLUG" >> .env.tmp
              [ -n "$ONEACCESS_REDIRECT_URL" ] && echo "ONEACCESS_REDIRECT_URL=$ONEACCESS_REDIRECT_URL" >> .env.tmp
              [ -n "$ONEACCESS_APP_ID" ] && echo "ONEACCESS_APP_ID=$ONEACCESS_APP_ID" >> .env.tmp
              [ -n "$ONEACCESS_CLIENT_ID" ] && echo "ONEACCESS_CLIENT_ID=$ONEACCESS_CLIENT_ID" >> .env.tmp
              [ -n "$ONEACCESS_CLIENT_SECRET" ] && echo "ONEACCESS_CLIENT_SECRET=$ONEACCESS_CLIENT_SECRET" >> .env.tmp
              [ -n "$ONEACCESS_PUBLIC_KEY_PATH" ] && echo "ONEACCESS_PUBLIC_KEY_PATH=$ONEACCESS_PUBLIC_KEY_PATH" >> .env.tmp
              [ -n "$ONEACCESS_ACCESS_TOKEN_TTL" ] && echo "ONEACCESS_ACCESS_TOKEN_TTL=$ONEACCESS_ACCESS_TOKEN_TTL" >> .env.tmp
              [ -n "$AUTH_LOCAL_LOGIN_ENABLED" ] && echo "AUTH_LOCAL_LOGIN_ENABLED=$AUTH_LOCAL_LOGIN_ENABLED" >> .env.tmp
              mv .env.tmp .env
              echo "oneAccess config synced to .env (SSO enabled: slug=$ONEACCESS_APP_SLUG)."
            else
              echo "No ONEACCESS_API_BASE_URL secret set — oneAccess stays disabled (local login)."
            fi
            # Sync database credentials from CI secrets. Fails CLOSED: with no
            # DB_NAME the box keeps the .env it has, so a missing secret can never
            # silently repoint a running box at a different database.
            # Write one key, and ONLY when a value was actually supplied. An unset
            # secret must never change the box: the earlier version stripped all five
            # keys and rewrote them unconditionally, so unset DB_HOST/DB_PORT secrets
            # blanked a working localhost/3306 and the app could not resolve its
            # database at all.
            set_env() {
              [ -z "$2" ] && return 0
              touch .env
              grep -v -E "^$1=" .env > .env.tmp || true
              echo "$1=$2" >> .env.tmp
              mv .env.tmp .env
            }
            if [ -n "$DB_NAME" ]; then
              # Host and port are shared secrets; when they are not set, the only
              # sensible values are the ones db.js itself defaults to.
              : "${DB_HOST:=localhost}"
              : "${DB_PORT:=3306}"
              set_env DB_HOST "$DB_HOST"
              set_env DB_PORT "$DB_PORT"
              set_env DB_USER "$DB_USER"
              set_env DB_PASSWORD "$DB_PASSWORD"
              set_env DB_NAME "$DB_NAME"
              echo "Database config synced to .env (db=$DB_NAME user=$DB_USER)."
            else
              echo "No UAT_DB_NAME secret set — database config left as the box has it."
            fi
            # Token-signing key, per environment on purpose: one shared value would
            # make a token minted on UAT valid on production.
            if [ -n "$JWT_SECRET" ]; then
              set_env JWT_SECRET "$JWT_SECRET"
              echo "Token key synced to .env."
            else
              echo "No UAT_JWT_SECRET secret set — token key left as the box has it."
            fi
            # This box serves exactly one organisation, and the client asks the
            # server which one rather than the visitor choosing from a picker.
            # Written unconditionally because it is configuration, not a secret —
            # a box with no ORG_SLUG shows visitors a "not set up" page instead of
            # guessing, which would put them at another organisation's door.
            set_env ORG_SLUG "hqhb"
            # Preflight: never start a process that cannot boot. Without these the
            # app falls back to root@localhost with no password and the hardcoded
            # "dev-secret-change-me" token key, so it crash-loops behind a green
            # tick — which is what happened to WAQF on its first deploy.
            # DB_PASSWORD is absent from this list: an empty password is legitimate.
            MISSING=""
            for k in DB_HOST DB_PORT DB_USER DB_NAME JWT_SECRET ORG_SLUG; do
              grep -qE "^$k=.+" .env || MISSING="$MISSING $k"
            done
            if [ -n "$MISSING" ]; then
              echo "REFUSING TO START — missing from .env:$MISSING"
              echo "Set them as CI secrets, or put them in .env on the box, then re-run."
              exit 1
            fi
            # Everything above has been written to .env where it was set. Unset it
            # all now: pm2 hands its own environment to the app, and dotenv does NOT
            # overwrite a variable that already exists there. An unset secret arrives
            # as an EMPTY STRING, which silently overrides the box's own .env value —
            # and db.js destructures with defaults, which apply to undefined but not
            # to "". That is what took UAT down on 2026-08-29: DB_USER arrived empty
            # and the app tried to connect as ''@'localhost'.
            unset SENDGRID_API_KEY SENDGRID_FROM_EMAIL SENDGRID_FROM_NAME \
                  CONFIDENTIAL_KEY STORAGE_ENDPOINT STORAGE_REGION STORAGE_BUCKET \
                  STORAGE_FORCE_PATH_STYLE STORAGE_ACCESS_KEY STORAGE_SECRET_KEY \
                  DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME JWT_SECRET \
                  ONEACCESS_API_BASE_URL ONEACCESS_FRONTEND_URL ONEACCESS_APP_SLUG \
                  ONEACCESS_REDIRECT_URL ONEACCESS_APP_ID ONEACCESS_CLIENT_ID \
                  ONEACCESS_CLIENT_SECRET ONEACCESS_PUBLIC_KEY_PATH \
                  ONEACCESS_ACCESS_TOKEN_TTL AUTH_LOCAL_LOGIN_ENABLED
            npm ci --omit=dev
            pm2 delete onesign_backend_uat 2>/dev/null || true
            PORT=5101 pm2 start src/index.js --name onesign_backend_uat --cwd /home/ubuntu/OneSign/server
            pm2 save
            # A start is not a success. pm2 reports "online" the instant it forks, so
            # a process that dies on its first database call still looks healthy —
            # which is how both UAT and WAQF sat crash-looping behind green runs.
            # Poll the real endpoint and fail the deploy if it never answers.
            echo "waiting for the app to answer on 127.0.0.1:5101 ..."
            HEALTHY=""
            for i in $(seq 1 15); do
              sleep 2
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 4 "http://127.0.0.1:5101/api/auth/organisations" 2>/dev/null || true)
              if [ "$CODE" = "200" ]; then HEALTHY="yes"; echo "healthy after $((i*2))s (HTTP 200)"; break; fi
            done
            if [ -z "$HEALTHY" ]; then
              echo "DEPLOY FAILED — onesign_backend_uat never answered on 5101. Recent errors:"
              pm2 logs onesign_backend_uat --nostream --lines 30 --err 2>/dev/null | tail -20
              exit 1
            fi

      - name: Ensure nginx serves .mjs + .webmanifest with correct MIME type
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.UAT_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.UAT_EC2_SSH_KEY }}
          script: |
            if ! grep -q 'mjs' /etc/nginx/mime.types 2>/dev/null; then
              sudo sed -i 's|application/javascript\s\+js;|application/javascript  js mjs;|' /etc/nginx/mime.types
            fi
            # PWA manifest must be served as application/manifest+json (default is
            # octet-stream, which trips Chrome's manifest warning + Lighthouse).
            if ! grep -q 'webmanifest' /etc/nginx/mime.types 2>/dev/null; then
              sudo sed -i '/types {/a application/manifest+json webmanifest;' /etc/nginx/mime.types
            fi
            sudo nginx -t && sudo systemctl reload nginx
            # Retired asset: Leave Approval no longer uses a template. scp does not
            # prune deleted files, so remove the stale copy explicitly (exact name only).
            find /home/ubuntu/OneSign -name 'leave-template.xlsx' -delete 2>/dev/null || true
