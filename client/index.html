    <script>
      // Capture the install prompt as early as possible: the browser fires
      // beforeinstallprompt once, often before React has mounted. Stash it so the
      // in-app "Install app" button can trigger it on demand.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__bipEvent = e;
        window.dispatchEvent(new Event('bip-available'));
      });
      window.addEventListener('appinstalled', function () {
        window.__bipEvent = null;
        window.dispatchEvent(new Event('bip-installed'));
      });
    </script>
